function getDistanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

window.processPlayerLogin = async function(){
  const nickInput = document.getElementById("loginNick").value.trim();
  const playerClass = document.getElementById("playerClassSelect").value;
  const roomCodeInput = document.getElementById("playerRoomCode").value.trim().toUpperCase();
  const team = document.getElementById("playerTeamSelect").value;

  if(!nickInput){ swal("Error", "Debes ingresar un Nick para jugar", "warning"); return; }

  if(nickInput.toLowerCase() === ADMIN_KEYWORD.toLowerCase()){
    STATE.isAdmin = true;
    STATE.user.nick = "Administrador";
    STATE.user.email = "admin_paraquelavols@game.com";
    document.getElementById("loginModal").remove();
    showAdminConfigScreen();
    return;
  }

  if(!roomCodeInput){ 
    swal("Falta Código", "Debes ingresar el Código de la Partida", "warning"); 
    return; 
  }

  const { data: roomData, error } = await supabase
    .from('rooms')
    .select('*')
    .eq('code', roomCodeInput)
    .eq('active', true)
    .maybeSingle();

  if(error || !roomData) {
    swal("Sala no encontrada ❌", `La sala "${roomCodeInput}" no existe o el Administrador aún no la ha creado.`, "error");
    return;
  }

  STATE.isAdmin = false;
  STATE.user.nick = nickInput;
  STATE.user.playerClass = playerClass;
  STATE.user.email = `${nickInput.toLowerCase().replace(/\s+/g, '_')}_${playerClass.replace(/[^a-zA-Z]/g, '')}@game.com`;
  STATE.roomCode = roomCodeInput;
  STATE.team = team;

  const { count, error: countErr } = await supabase
    .from('player_cards')
    .select('*', { count: 'exact', head: true })
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email);

  if(!countErr && count !== null) {
    STATE.cardsCaptured = count;
    STATE.playerLevel = Math.floor(count / 5) + 1;
  }

  document.getElementById("redScore").innerText = roomData.red_score || 0;
  document.getElementById("blueScore").innerText = roomData.blue_score || 0;

  document.getElementById("loginModal").remove();
  launchGameEngine(roomData.duration || 30);
};

async function loadChatMessages() {
  const { data } = await supabase
    .from('geocard_mensajes')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .order('created_at', { ascending: true })
    .limit(30);

  const container = document.getElementById("chatMessages");
  container.innerHTML = "";
  if(data) {
    data.forEach(m => appendChatMessage(m));
  }
}

function listenChatMessages() {
  supabase.channel('public:geocard_mensajes')
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'geocard_mensajes', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      appendChatMessage(payload.new);
    })
    .subscribe();
}

async function sendChatMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;

  await supabase.from('geocard_mensajes').insert({
    room_code: STATE.roomCode,
    nick: STATE.user.nick,
    team: STATE.team,
    message: text
  });

  input.value = "";
}

function appendChatMessage(m) {
  const container = document.getElementById("chatMessages");
  const teamColor = m.team === 'red' ? '#e63946' : '#38bdf8';
  
  const div = document.createElement("div");
  div.style.marginBottom = "4px";
  div.style.transition = "opacity 0.5s ease";
  div.innerHTML = `<b style="color:${teamColor};">${m.nick}:</b> ${escapeHtml(m.message)}`;
  
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  setTimeout(() => {
    if (div && div.parentNode) {
      div.style.opacity = "0";
      setTimeout(() => div.remove(), 500);
    }
  }, 60000);
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function initMap(){
  if(STATE.mapInitialized) return;
  STATE.map = L.map('map').setView([STATE.userLat, STATE.userLng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(STATE.map);
  STATE.mapInitialized = true;
}

function startGeolocationTracking(){
  if ("geolocation" in navigator) {
    const geoOptions = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };
    STATE.watchPositionId = navigator.geolocation.watchPosition(
      (position) => {
        STATE.userLat = position.coords.latitude;
        STATE.userLng = position.coords.longitude;
        updateUserPositionOnMap();
        checkAndSpawnCardsAroundPlayer(); 
      },
      (error) => {
        console.warn("Error de geolocalización:", error.message);
        updateUserPositionOnMap();
      },
      geoOptions
    );
  } else {
    updateUserPositionOnMap();
  }
}

async function checkAndSpawnCardsAroundPlayer() {
  if (!STATE.roomCode) return;

  const { data: nearbyCards } = await supabase
    .from('geocaches')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('claimed', false);

  let closeCount = 0;
  if (nearbyCards) {
    nearbyCards.forEach(c => {
      const dist = getDistanceInMeters(STATE.userLat, STATE.userLng, c.lat, c.lng);
      if (dist < 400) closeCount++;
    });
  }

  if (closeCount < 4) {
    const newCardsToSpawn = 2;
    for (let i = 0; i < newCardsToSpawn; i++) {
      const radiusOffset = 0.001 + Math.random() * 0.002;
      const angle = Math.random() * 2 * Math.PI;
      const latOffset = radiusOffset * Math.cos(angle);
      const lngOffset = radiusOffset * Math.sin(angle) / Math.cos(STATE.userLat * Math.PI / 180);

      const spawnLat = STATE.userLat + latOffset;
      const spawnLng = STATE.userLng + lngOffset;

      const randomTemplate = CARD_POOL[Math.floor(Math.random() * CARD_POOL.length)];

      await supabase.from('geocaches').insert({
        room_code: STATE.roomCode,
        lat: spawnLat,
        lng: spawnLng,
        claimed: false,
        card_name: randomTemplate.name,
        card_type: randomTemplate.type || "Ataque",
        attack: randomTemplate.attack,
        defense: randomTemplate.defense,
        image_url: ""
      });
    }
    loadGeocachesFromSupabase();
  }
}

  if(STATE.playerLevel >= 2) {
    const colorsList = ['#e9c46a', '#38bdf8', '#a855f7', '#ec4899', '#22c55e', '#f97316'];
    const badgeColor = colorsList[(STATE.playerLevel - 2) % colorsList.length];
    
    glowStyle = `box-shadow: 0 0 ${14 + STATE.playerLevel}px ${badgeColor}, 0 0 25px ${color}; border: 3px solid ${badgeColor};`;
    badgeHTML = `<div style="position:absolute; top:-12px; right:-12px; background:${badgeColor}; color:#073b4c; font-size:10px; font-weight:bold; padding:1px 4px; border-radius:6px; border:1px solid white;">⭐L${STATE.playerLevel}</div>`;
  }

  const playerIcon = L.divIcon({
    className: "my-position-icon",
    html: `<div style="position:relative; background:${color}; width:22px; height:22px; border-radius:50%; border:3px solid white; ${glowStyle}">${badgeHTML}</div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });

  if(STATE.userMarker){
    STATE.userMarker.setLatLng([STATE.userLat, STATE.userLng]);
    STATE.userMarker.setIcon(playerIcon);
  } else {
    STATE.userMarker = L.marker([STATE.userLat, STATE.userLng], { icon: playerIcon, zIndexOffset: 1000 }).addTo(STATE.map);
    STATE.userMarker.bindPopup(`<b>${STATE.user.nick} (${STATE.user.playerClass})</b><br>Nivel XP: ${STATE.playerLevel}`);
    STATE.map.setView([STATE.userLat, STATE.userLng], 16);
  }

  let circleRadius = 60;
  if(STATE.selectedPerk === 'tank') circleRadius = 85;

  if(STATE.rangeCircle){
    STATE.rangeCircle.setLatLng([STATE.userLat, STATE.userLng]);
    STATE.rangeCircle.setRadius(circleRadius);
  } else {
    STATE.rangeCircle = L.circle([STATE.userLat, STATE.userLng], {
      color: color, fillColor: color, fillOpacity: 0.15, radius: circleRadius
    }).addTo(STATE.map);
  }

  if(roomChannel){
    roomChannel.track({
      nick: `${STATE.user.nick} (${STATE.user.playerClass})`,
      lat: STATE.userLat, lng: STATE.userLng,
      team: STATE.team, level: STATE.playerLevel,
      online_at: new Date().toISOString()
    });
  }
}

async function loadGeocachesFromSupabase(){
  const { data, error } = await supabase.from('geocaches').select('*').eq('room_code', STATE.roomCode).eq('claimed', false);
  if(error || !data) return;

  data.forEach(cache => {
    if (mapMarkersList[cache.id]) return;

    const cacheIcon = L.divIcon({
      className: "custom-card-icon",
      html: `<div class="modernCardMarker">🎴</div>`,
      iconSize: [36, 48], iconAnchor: [18, 24]
    });

    const marker = L.marker([cache.lat, cache.lng], { icon: cacheIcon }).addTo(STATE.map);
    mapMarkersList[cache.id] = marker;

    marker.on("click", async () => {
      let maxReach = 80;
      if(STATE.selectedPerk === 'tank') maxReach = 105;

      const distance = getDistanceInMeters(STATE.userLat, STATE.userLng, cache.lat, cache.lng);
      if(distance > maxReach){
        swal("Estás muy lejos (" + Math.round(distance) + "m)", "Entra dentro de tu círculo para reclamar esta carta.", "warning");
        return;
      }

      await supabase.from('geocaches').update({ claimed: true, team: STATE.team }).eq('id', cache.id);

      STATE.cardsCaptured++;
      checkPlayerLevelProgression();

      const randomTemplate = CARD_POOL[Math.floor(Math.random() * CARD_POOL.length)];
      let finalAttack = randomTemplate.attack;
      let finalDefense = randomTemplate.defense;
      if(STATE.selectedPerk === 'berserker') {
        finalAttack += 15;
      }

      const { data: existingCards } = await supabase.from('player_cards').select('*').eq('room_code', STATE.roomCode).eq('user_email', STATE.user.email).eq('card_name', randomTemplate.name);

      if(existingCards && existingCards.length > 0) {
        const cardToUpgrade = existingCards[0];
        const newAttack = cardToUpgrade.attack + 15;
        const newDefense = cardToUpgrade.defense + 15;
        await supabase.from('player_cards').update({ attack: newAttack, defense: newDefense }).eq('id', cardToUpgrade.id);
        swal("✨ ¡CARTA EVOLUCIONADA! ✨", `¡Has encontrado otro "${randomTemplate.name}"!\n⚔️ Ataque: ${newAttack} | 🛡️ Defensa: ${newDefense}`, "success");
      } else {
        await supabase.from('player_cards').insert({
          room_code: STATE.roomCode, team: STATE.team, user_email: STATE.user.email,
          card_name: randomTemplate.name, attack: finalAttack, defense: finalDefense, image_url: ""
        });
        swal("¡Carta Conseguida! 🎴", `Has obtenido por primera vez: ${randomTemplate.name}`, "success");
      }

      if(mapMarkersList[cache.id]) {
        STATE.map.removeLayer(mapMarkersList[cache.id]);
        delete mapMarkersList[cache.id];
      }
    });
  });
}

function listenGeocacheChanges() {
  supabase.channel('public:geocaches')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'geocaches', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      const updatedCache = payload.new;
      if (updatedCache.claimed && mapMarkersList[updatedCache.id]) {
        STATE.map.removeLayer(mapMarkersList[updatedCache.id]);
        delete mapMarkersList[updatedCache.id];
      }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'geocaches', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      loadGeocachesFromSupabase();
    })
    .subscribe();
}

function checkPlayerLevelProgression() {
  const xpDisplay = document.getElementById("playerXpDisplay");
  const calculatedLevel = Math.floor(STATE.cardsCaptured / 5) + 1;

  if(calculatedLevel > STATE.playerLevel) {
    STATE.playerLevel = calculatedLevel;
    swal("🌟 ¡SUBIDÓN DE XP! (Nivel " + STATE.playerLevel + ")", "¡Has subido de nivel! Elige tu ventaja táctica:", "success");
    updateUserPositionOnMap();
    showPerkSelectionModal();
  }

  if(xpDisplay) {
    const currentLevelBaseCards = (STATE.playerLevel - 1) * 5;
    const progressInLevel = STATE.cardsCaptured - currentLevelBaseCards;
    xpDisplay.innerText = `Nivel ${STATE.playerLevel} (${progressInLevel}/5 para el siguiente)`;
  }
}

function showPerkSelectionModal() {
  const perkModal = document.createElement("div");
  perkModal.className = "modal";
  perkModal.id = "perkModal";
  perkModal.innerHTML = `
    <div>
      <h2>⚡ ¡Elige tu Habilidad de Nivel ${STATE.playerLevel}!</h2>
      <p style="font-size:13px; color:#cbd5e1; margin-bottom:15px;">Selecciona un beneficio táctico para potenciar tu aventura:</p>
      <button onclick="window.selectPerk('tank')" style="width:90%; background:linear-gradient(45deg,#2a9d8f,#264653);">🛡️ Tanque Táctico (+Radio de Captura)</button><br>
      <button onclick="window.selectPerk('berserker')" style="width:90%; background:linear-gradient(45deg,#e76f51,#f4a261);">⚔️ Furia Berserker (+15 Ataque en Cartas)</button><br>
      <button onclick="window.selectPerk('radar')" style="width:90%; background:linear-gradient(45deg,#457b9d,#1d3557);">📡 Radar Ágil (Visión extendida)</button>
    </div>
  `;
  document.body.appendChild(perkModal);
}

window.selectPerk = function(perkType) {
  STATE.selectedPerk = perkType;
  const perkNames = { tank: "Tanque Táctico 🛡️", berserker: "Furia Berserker ⚔️", radar: "Radar Ágil 📡" };
  swal("¡Habilidad Activada!", `Has seleccionado: ${perkNames[perkType]}`, "success");
  updateUserPositionOnMap();
  document.getElementById("perkModal").remove();
};

function listenRoomChanges() {
  supabase.channel('public:rooms').on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `code=eq.${STATE.roomCode}` }, payload => {
    if(payload.new){
      document.getElementById("redScore").innerText = payload.new.red_score || 0;
      document.getElementById("blueScore").innerText = payload.new.blue_score || 0;
    }
  }).subscribe();
}

function setupRealtimePresence() {
  const presenceKey = STATE.user.email || STATE.user.nick;

  roomChannel = supabase.channel('room_' + STATE.roomCode, {
    config: { presence: { key: presenceKey } }
  });

  roomChannel
    .on('presence', { event: 'sync' }, () => {
      const state = roomChannel.presenceState();
      updatePlayerMarkers(state);
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await roomChannel.track({
          nick: `${STATE.user.nick} (${STATE.user.playerClass})`,
          lat: STATE.userLat, 
          lng: STATE.userLng,
          team: STATE.team, 
          level: STATE.playerLevel,
          online_at: new Date().toISOString()
        });
      }
    });
}

function updatePlayerMarkers(presenceState) {
  let totalPlayers = 0;
  const activeKeys = Object.keys(presenceState);

  // 1. Eliminar marcadores de jugadores desconectados
  Object.keys(playerMarkers).forEach(emailKey => {
    if (!activeKeys.includes(emailKey)) {
      if (playerMarkers[emailKey]) {
        STATE.map.removeLayer(playerMarkers[emailKey]);
        delete playerMarkers[emailKey];
      }
    }
  });

  // 2. Crear o actualizar marcadores de los jugadores conectados
  activeKeys.forEach(emailKey => {
    const playerDatas = presenceState[emailKey];
    if (!playerDatas || playerDatas.length === 0) return;

    const data = playerDatas[playerDatas.length - 1];
    totalPlayers++;

    // Evitar renderizar nuestro propio marcador como externo
    if (emailKey === STATE.user.email) return;

    const color = data.team === 'red' ? '#e63946' : '#1d3557';
    let enemyGlow = "box-shadow:0 0 6px rgba(0,0,0,0.5);";
    let enemyBadge = "";

    if (data.level && data.level >= 2) {
      enemyGlow = "box-shadow: 0 0 14px #e9c46a; border: 2px solid #e9c46a;";
      enemyBadge = `<div style="position:absolute; top:-10px; right:-10px; background:#e9c46a; color:#073b4c; font-size:9px; font-weight:bold; padding:1px 3px; border-radius:4px;">⭐L${data.level}</div>`;
    }

    const playerIcon = L.divIcon({
      className: "player-icon",
      html: `<div style="position:relative; background:${color}; width:18px; height:18px; border-radius:50%; border:2px solid white; ${enemyGlow}">${enemyBadge}</div>`,
      iconSize: [18, 18], 
      iconAnchor: [9, 9]
    });

    if (playerMarkers[emailKey]) {
      playerMarkers[emailKey].setLatLng([data.lat, data.lng]);
      playerMarkers[emailKey].setIcon(playerIcon);
    } else {
      const marker = L.marker([data.lat, data.lng], { icon: playerIcon }).addTo(STATE.map);
      marker.bindPopup(`<b>${data.nick || 'Jugador'}</b> (${data.team ? data.team.toUpperCase() : ''})<br>Nivel: ${data.level || 1}`);
      playerMarkers[emailKey] = marker;
    }
  });

  const onlineEl = document.getElementById("onlineCount");
  if (onlineEl) onlineEl.innerText = totalPlayers;
}

function startTimer(durationSeconds) {
  let timer = durationSeconds;
  const timerDisplay = document.getElementById("timer");
  if(timerInterval) clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    let minutes = parseInt(timer / 60, 10);
    let seconds = parseInt(timer % 60, 10);
    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;

    if(timerDisplay) timerDisplay.textContent = minutes + ":" + seconds;

    if (--timer < 0) {
      clearInterval(timerInterval);
      swal("¡Tiempo Terminado!", "La partida ha finalizado.", "info");
    }
  }, 1000);
}

document.getElementById("btnExit").addEventListener("click", () => {
  window.location.reload();
});

async function showAdminConfigScreen(){
  const modalDiv = document.createElement("div");
  modalDiv.className = "modal";
  modalDiv.id = "adminModal";

  const { data: rooms } = await supabase.from('rooms').select('*');
  let roomListHTML = "";

  if(rooms && rooms.length > 0){
    rooms.forEach(r => {
      roomListHTML += `
        <div class="room-item">
          <span><b>${r.code}</b> (Global - ${r.duration}m)</span>
          <div>
            <button class="btn-enter" onclick="window.adminEnterRoom('${r.code}', ${r.duration})">👁️ Entrar</button>
            <button class="btn-delete" onclick="window.deleteRoom('${r.code}')">🗑️ Borrar</button>
          </div>
        </div>
      `;
    });
  } else {
    roomListHTML = "<p style='font-size:12px; color:#94a3b8;'>No hay salas creadas aún.</p>";
  }

  modalDiv.innerHTML = `
    <div>
      <h2>👑 Panel del Administrador</h2>
      <div style="background:rgba(255,255,255,0.05); padding:12px; border-radius:12px; margin-bottom:15px; text-align:left; border:1px solid rgba(255,255,255,0.1);">
        <b>Crear Nueva Sala Global:</b><br>
        <input id="adminRoomCode" placeholder="Código (Ej: MUNDIAL2026)"><br>
        <select id="adminDurationSelect">
          <option value="15">15 minutos</option>
          <option value="30" selected>30 minutos</option>
          <option value="60">60 minutos</option>
        </select><br>
        <button onclick="window.createRoom()" style="width:100%;">Crear Sala 🚀</button>
      </div>
      <h3>Salas Activas:</h3>
      <div style="max-height:180px; overflow-y:auto; text-align:left; padding-right:5px;">${roomListHTML}</div><br>
      <button onclick="window.location.reload()" class="btn-secondary">Cerrar Sesión Admin ✖️</button>
    </div>
  `;
  document.body.appendChild(modalDiv);
}

window.createRoom = async function(){
  const code = document.getElementById("adminRoomCode").value.trim().toUpperCase();
  const duration = parseInt(document.getElementById("adminDurationSelect").value);

  if(!code) { swal("Error", "Ingresa un código para la sala", "warning"); return; }

  const { error } = await supabase.from('rooms').insert({
    code: code,
    duration: duration,
    active: true,
    red_score: 0,
    blue_score: 0
  });

  if(error) {
    swal("Error", "No se pudo crear la sala (quizás ya exista)", "error");
    return;
  }

  swal("¡Sala Creada!", `La sala ${code} está lista para usarse en cualquier lugar.`, "success");
  document.getElementById("adminModal").remove();
  showAdminConfigScreen();
};

window.deleteRoom = async function(code){
  await supabase.from('rooms').delete().eq('code', code);
  swal("Eliminada", `La sala ${code} fue borrada.`, "info");
  document.getElementById("adminModal").remove();
  showAdminConfigScreen();
};

window.adminEnterRoom = function(code, duration){
  STATE.isAdmin = false;
  STATE.user.nick = "Admin Spectator";
  STATE.user.playerClass = "⚔️ Guerrero";
  STATE.user.email = "admin_spectator@game.com";
  STATE.roomCode = code;
  STATE.team = "red";

  document.getElementById("adminModal").remove();
  launchGameEngine(duration);
};
</script>
