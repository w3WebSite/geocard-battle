function getDistanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

window.processPlayerLogin = async function(){
  const nickInput = document.getElementById("loginNick").value.trim();

  const team = document.getElementById("playerTeamSelect").value;

  if(!nickInput){ swal("Error", "Debes ingresar un Nick para jugar", "warning"); return; }

  if(nickInput.toLowerCase() === ADMIN_KEYWORD.toLowerCase()){
    STATE.isAdmin = true;
    STATE.user.nick = "Administrador";
    STATE.user.email = "admin_paraquelavols@game.com";
    document.getElementById("loginModal").remove();
    showAdminConfigScreen();
    return;
  }

  if(!roomCodeInput){ 
    swal("Falta Código", "Debes ingresar el Código de la Partida creada por el Administrador", "warning"); 
    return; 
  }

  const { data: roomData, error } = await supabase
    .from('rooms')
    .select('*')
    .eq('code', roomCodeInput)
    .eq('active', true)
    .maybeSingle();

  if(error || !roomData) {
    swal("Sala no encontrada ❌", `La sala "${roomCodeInput}" no existe o el Administrador aún no la ha creado.`, "error");
    return;
  }

  const cityKey = roomData.city || "deltebre";
  if(CITIES[cityKey]) {
    STATE.userLat = CITIES[cityKey].lat;
    STATE.userLng = CITIES[cityKey].lng;
  }

  STATE.isAdmin = false;
  STATE.user.nick = nickInput;
  STATE.user.email = `${nickInput.toLowerCase().replace(/\s+/g, '_')}@game.com`;
  STATE.roomCode = roomCodeInput;
  STATE.team = team;

  document.getElementById("loginModal").remove();
  launchGameEngine(roomData.duration || 30);
};

window.startAdminGame = async function(){
  const code = document.getElementById("adminRoomCode").value.trim().toUpperCase();
  const cityKey = document.getElementById("adminCitySelect").value;
  const duration = parseInt(document.getElementById("adminDuration").value) || 30;
  const maxCards = parseInt(document.getElementById("adminMaxCards").value) || 12;

  if(!code){ swal("Error", "El código de sala no puede estar vacío", "warning"); return; }

  const cityData = CITIES[cityKey];
  STATE.userLat = cityData.lat;
  STATE.userLng = cityData.lng;
  STATE.roomCode = code;
  STATE.team = "red";

  await supabase.from('rooms').upsert({
    code: STATE.roomCode,
    active: true,
    city: cityKey,
    duration: duration,
    red_score: 0,
    blue_score: 0
  }, { onConflict: 'code' });

  await supabase.from('geocaches').delete().eq('room_code', STATE.roomCode);

  const newGeocaches = [];
  for(let i = 0; i < maxCards; i++){
    const template = CARD_POOL[i % CARD_POOL.length];
    const offsetLat = (Math.random() - 0.5) * 0.03;
    const offsetLng = (Math.random() - 0.5) * 0.03;

    newGeocaches.push({
      room_code: STATE.roomCode,
      lat: STATE.userLat + offsetLat,
      lng: STATE.userLng + offsetLng,
      card_name: template.name,
      card_type: template.type,
      attack: template.attack,
      defense: template.defense,
      claimed: false
    });
  }

  await supabase.from('geocaches').insert(newGeocaches);

  document.getElementById("adminModal").remove();
  launchGameEngine(duration);
};

function launchGameEngine(durationMinutes){
  document.getElementById("panel").style.display = "block";
  document.getElementById("btnExit").style.display = "inline-block";
  document.getElementById("timerContainer").style.display = "block";

  initMap();
  startGeolocationTracking();
  loadGeocachesFromSupabase();
  listenRoomChanges();
  setupRealtimePresence();
  startTimer(durationMinutes * 60);
}

function initMap(){
  if(STATE.mapInitialized) return;
  STATE.map = L.map('map').setView([STATE.userLat, STATE.userLng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(STATE.map);
  STATE.mapInitialized = true;
}

function startGeolocationTracking(){
  if ("geolocation" in navigator) {
    const geoOptions = {
      enableHighAccuracy: true,
      timeout: 15000,
      maximumAge: 0
    };

    STATE.watchPositionId = navigator.geolocation.watchPosition(
      (position) => {
        STATE.userLat = position.coords.latitude;
        STATE.userLng = position.coords.longitude;
        updateUserPositionOnMap();
      },
      (error) => {
        console.warn("Error de geolocalización o GPS desactivado:", error.message);
        swal("Aviso GPS", "No se pudo obtener tu ubicación exacta en tiempo real. Usando la ciudad por defecto.", "info");
        updateUserPositionOnMap();
      },
      geoOptions
    );
  } else {
    swal("GPS no compatible", "Tu navegador no soporta geolocalización.", "error");
    updateUserPositionOnMap();
  }
}

function updateUserPositionOnMap(){
  if(!STATE.map) return;

  const color = STATE.team === 'red' ? '#e63946' : '#1d3557';
  
  // Insignia visual si es nivel 2 o superior (XP boost activo)
  let glowStyle = "box-shadow:0 0 10px rgba(0,0,0,0.6);";
  let badgeHTML = "";
  if(STATE.playerLevel >= 2) {
    glowStyle = "box-shadow: 0 0 16px #e9c46a, 0 0 25px #e63946; border: 3px solid #e9c46a;";
    badgeHTML = `<div style="position:absolute; top:-12px; right:-12px; background:#e9c46a; color:#073b4c; font-size:10px; font-weight:bold; padding:1px 4px; border-radius:6px; border:1px solid white;">⭐L${STATE.playerLevel}</div>`;
  }

  const playerIcon = L.divIcon({
    className: "my-position-icon",
    html: `<div style="position:relative; background:${color}; width:22px; height:22px; border-radius:50%; border:3px solid white; ${glowStyle}">${badgeHTML}</div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });

  if(STATE.userMarker){
    STATE.userMarker.setLatLng([STATE.userLat, STATE.userLng]);
    STATE.userMarker.setIcon(playerIcon);
  } else {
    STATE.userMarker = L.marker([STATE.userLat, STATE.userLng], { icon: playerIcon, zIndexOffset: 1000 }).addTo(STATE.map);
    STATE.userMarker.bindPopup(`<b>${STATE.user.nick} (Tú)</b><br>Nivel XP: ${STATE.playerLevel}`);
    STATE.map.setView([STATE.userLat, STATE.userLng], 16);
  }

  let circleRadius = 60;
  if(STATE.selectedPerk === 'tank') circleRadius = 75; // Ventaja del tanque

  if(STATE.rangeCircle){
    STATE.rangeCircle.setLatLng([STATE.userLat, STATE.userLng]);
    STATE.rangeCircle.setRadius(circleRadius);
  } else {
    STATE.rangeCircle = L.circle([STATE.userLat, STATE.userLng], {
      color: color,
      fillColor: color,
      fillOpacity: 0.15,
      radius: circleRadius
    }).addTo(STATE.map);
  }

  if(roomChannel){
    roomChannel.track({
      nick: STATE.user.nick,
      lat: STATE.userLat,
      lng: STATE.userLng,
      team: STATE.team,
      level: STATE.playerLevel,
      online_at: new Date().toISOString()
    });
  }
}

async function loadGeocachesFromSupabase(){
  const { data, error } = await supabase
    .from('geocaches')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('claimed', false);

  if(error) { console.error("Error cargando cartas:", error); return; }
  if(!data || data.length === 0) { console.log("No hay cartas pendientes en esta sala."); return; }

  const group = [];

  data.forEach(cache => {
    const cacheIcon = L.divIcon({
      className: "custom-card-icon",
      html: `<div class="modernCardMarker">🎴</div>`,
      iconSize: [36, 48],
      iconAnchor: [18, 24]
    });

    const marker = L.marker([cache.lat, cache.lng], { icon: cacheIcon }).addTo(STATE.map);
    group.push(marker);

    marker.on("click", async () => {
      let maxReach = 80;
      if(STATE.selectedPerk === 'tank') maxReach = 95; // Alcance extendido

      const distance = getDistanceInMeters(STATE.userLat, STATE.userLng, cache.lat, cache.lng);
      if(distance > maxReach){
        swal("Estás muy lejos (" + Math.round(distance) + "m)", "Entra dentro de tu círculo para reclamar esta carta.", "warning");
        return;
      }

      const { error: updateErr } = await supabase
        .from('geocaches')
        .update({ claimed: true, team: STATE.team })
        .eq('id', cache.id);

      if(updateErr){ swal("Error al reclamar"); return; }

      // Incrementar contador de XP / Cartas capturadas
      STATE.cardsCaptured++;
      checkPlayerLevelProgression();

      const { data: existingCards } = await supabase
        .from('player_cards')
        .select('*')
        .eq('room_code', STATE.roomCode)
        .eq('user_email', STATE.user.email)
        .eq('card_name', cache.card_name);

      if(existingCards && existingCards.length > 0) {
        const cardToUpgrade = existingCards[0];
        const newAttack = cardToUpgrade.attack + 15;
        const newDefense = cardToUpgrade.defense + 15;

        await supabase
          .from('player_cards')
          .update({ attack: newAttack, defense: newDefense })
          .eq('id', cardToUpgrade.id);

        swal("✨ ¡CARTA EVOLUCIONADA! ✨", `¡Has encontrado otro "${cache.card_name}"!\nSus atributos han subido:\n⚔️ Ataque: ${newAttack} | 🛡️ Defensa: ${newDefense}`, "success");
      } else {
        await supabase.from('player_cards').insert({
          room_code: STATE.roomCode,
          team: STATE.team,
          user_email: STATE.user.email,
          card_name: cache.card_name,
          attack: cache.attack,
          defense: cache.defense,
          image_url: cache.image_url || ""
        });

        swal("¡Carta Conseguida! 🎴", `Has obtenido por primera vez: ${cache.card_name}`, "success");
      }

      STATE.map.removeLayer(marker);
    });
  });

  if(group.length > 0){
    const featureGroup = L.featureGroup(group);
    STATE.map.fitBounds(featureGroup.getBounds().pad(0.2));
  }
}

function checkPlayerLevelProgression() {
  const xpDisplay = document.getElementById("playerXpDisplay");

  if(STATE.cardsCaptured === 5 && STATE.playerLevel < 2) {
    STATE.playerLevel = 2;
    swal("🌟 ¡SUBIDÓN DE XP! (Nivel 2)", "¡Has capturado 5 cartas! Has desbloqueado un **Multiplicador de XP** y una aureola brillante visible para todos en el mapa.", "success");
    updateUserPositionOnMap();
  } else if(STATE.cardsCaptured === 10 && STATE.playerLevel < 3) {
    STATE.playerLevel = 3;
    showPerkSelectionModal();
  }

  if(xpDisplay) {
    if(STATE.playerLevel === 1) xpDisplay.innerText = `Nivel 1 (${STATE.cardsCaptured}/5)`;
    else if(STATE.playerLevel === 2) xpDisplay.innerText = `⭐ Nivel 2 (${STATE.cardsCaptured}/10)`;
    else xpDisplay.innerText = `🔥 Nivel 3 Máximo`;
  }
}

function showPerkSelectionModal() {
  const perkModal = document.createElement("div");
  perkModal.className = "modal";
  perkModal.innerHTML = `
    <div>
      <h2>⚡ ¡ELECCIÓN DE ROL TÁCTICO! (Nivel 3)</h2>
      <p>Has alcanzado 10 cartas capturadas. Selecciona una ventaja única:</p>
      <div style="text-align:left; font-size:13px; background:rgba(255,255,255,0.05); padding:10px; border-radius:8px; margin:10px 0;">
        <label><input type="radio" name="perkChoice" value="gladiator" checked> <b>⚔️ Gladiador:</b> +30 de Ataque extra en el primer asalto de tus duelos PvP.</label><br><br>
        <label><input type="radio" name="perkChoice" value="tank"> <b>🛡️ Tanque:</b> +25 de Defensa extra y radio de captura ampliado a 95m.</label><br><br>
        <label><input type="radio" name="perkChoice" value="explorer"> <b>⚡ Explorador:</b> Duplica la velocidad de tus bonificaciones de puntuación.</label>
      </div><br>
      <button onclick="window.confirmPerkSelection()">Confirmar Habilidad 🚀</button>
    </div>
  `;
  document.body.appendChild(perkModal);

  window.confirmPerkSelection = function() {
    const radios = document.getElementsByName("perkChoice");
    for(let r of radios) {
      if(r.checked) {
        STATE.selectedPerk = r.value;
        break;
      }
    }
    perkModal.remove();
    updateUserPositionOnMap();
    swal("¡Habilidad Activada! 🎯", `Has seleccionado tu rol táctico con éxito. ¡A por la victoria!`, "success");
  };
}

function updatePlayerMarkers(presenceState) {
  let totalPlayers = 0;
  const now = Date.now();

  Object.keys(playerMarkers).forEach(email => {
    if (!presenceState[email]) {
      STATE.map.removeLayer(playerMarkers[email]);
      delete playerMarkers[email];
    }
  });

  Object.keys(presenceState).forEach(email => {
    const playerDatas = presenceState[email];
    totalPlayers += playerDatas.length;
    
    playerDatas.forEach(data => {
      if (email === STATE.user.email) return;

      const color = data.team === 'red' ? '#e63946' : '#1d3557';
      let enemyGlow = "box-shadow:0 0 6px rgba(0,0,0,0.5);";
      let enemyBadge = "";
      if(data.level && data.level >= 2) {
        enemyGlow = "box-shadow: 0 0 14px #e9c46a; border: 2px solid #e9c46a;";
        enemyBadge = `<div style="position:absolute; top:-10px; right:-10px; background:#e9c46a; color:#073b4c; font-size:9px; font-weight:bold; padding:1px 3px; border-radius:4px;">⭐L${data.level}</div>`;
      }

      const playerIcon = L.divIcon({
        className: "player-icon",
        html: `<div style="position:relative; background:${color}; width:18px; height:18px; border-radius:50%; border:2px solid white; ${enemyGlow}">${enemyBadge}</div>`,
        iconSize: [18, 18],
        iconAnchor: [9, 9]
      });

      if (playerMarkers[email]) {
        playerMarkers[email].setLatLng([data.lat, data.lng]);
        playerMarkers[email].setIcon(playerIcon);
      } else {
        const marker = L.marker([data.lat, data.lng], { icon: playerIcon }).addTo(STATE.map);
        marker.bindPopup(`<b>${data.nick || 'Jugador'}</b> (${data.team.toUpperCase()})<br>Nivel: ${data.level || 1}`);
        playerMarkers[email] = marker;
      }

      if(data.team !== STATE.team) {
        const distanceToEnemy = getDistanceInMeters(STATE.userLat, STATE.userLng, data.lat, data.lng);
        const lastBattle = battleCooldowns[email] || 0;

        if(distanceToEnemy <= 30 && (now - lastBattle > 120000)){
          battleCooldowns[email] = now;
          triggerTacticalPvPBattle(email, data.team, data.nick || 'Rival');
        }
      }
    });
  });

  const onlineEl = document.getElementById("onlineCount");
  if(onlineEl) onlineEl.innerText = totalPlayers;
}

async function triggerTacticalPvPBattle(enemyEmail, enemyTeam, enemyNick) {
  const { data: myCards } = await supabase
    .from('player_cards')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email);

  let cardOptions = "";
  if(myCards && myCards.length > 0) {
    myCards.forEach((c, index) => {
      let tier = "🟢 Común";
      let total = c.attack + c.defense;
      if(total > 180) tier = "🔥 ¡LEGENDARIA!";
      else if(total > 140) tier = "🟣 Épica";
      else if(total > 100) tier = "🔵 Rara";

      cardOptions += `<option value="${index}">${c.card_name} [${tier}] (⚔️${c.attack} | 🛡️${c.defense})</option>`;
    });
  } else {
    cardOptions = `<option value="-1">Carta Básica de Emergencia (⚔️15 | 🛡️15)</option>`;
  }

  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `
    <div>
      <h2>⚔️ ¡DUELO TÁCTICO PVP!</h2>
      <p>Te encuentras con <b>${enemyNick}</b> del equipo <b>${enemyTeam.toUpperCase()}</b>.</p>
      <p><b>Combate a 3 Rondas:</b> Selecciona tu carta para la <b>Ronda 1</b>:</p>
      <select id="roundCardSelect">${cardOptions}</select><br><br>
      <button onclick="window.startRound1('${enemyEmail}', '${enemyTeam}', '${enemyNick}')">Confirmar Ronda 1 🚀</button>
    </div>
  `;
  document.body.appendChild(modal);

  window.myWins = 0;
  window.enemyWins = 0;
  window.storedCards = myCards || [];

  window.startRound1 = function(eEmail, eTeam, eNick) {
    const sel = parseInt(document.getElementById("roundCardSelect").value);
    let myScore = 30;
    if(sel >= 0 && window.storedCards[sel]) {
      myScore = window.storedCards[sel].attack + window.storedCards[sel].defense;
    }
    // Bonificación de rol Gladiador en ronda 1
    if(STATE.selectedPerk === 'gladiator') myScore += 30;

    const enemyScore = Math.floor(Math.random() * 140) + 20;

    if(myScore >= enemyScore) window.myWins++;
    else window.enemyWins++;

    document.querySelector(".modal > div").innerHTML = `
      <h2>⚔️ DUELO TÁCTICO - Ronda 2</h2>
      <p>Parciales contra ${eNick}: Tú (${window.myWins}) - Rival (${window.enemyWins})</p>
      <p>Selecciona tu carta para la <b>Ronda 2</b>:</p>
      <select id="roundCardSelect">${cardOptions}</select><br><br>
      <button onclick="window.startRound2('${eEmail}', '${eTeam}', '${eNick}')">Confirmar Ronda 2 🚀</button>
    `;
  };

  window.startRound2 = function(eEmail, eTeam, eNick) {
    const sel = parseInt(document.getElementById("roundCardSelect").value);
    let myScore = 30;
    if(sel >= 0 && window.storedCards[sel]) {
      myScore = window.storedCards[sel].attack + window.storedCards[sel].defense;
    }
    // Bonificación de rol Tanque (+15 extra en defensa/ataque general si aplica)
    if(STATE.selectedPerk === 'tank') myScore += 15;

    const enemyScore = Math.floor(Math.random() * 140) + 20;

    if(myScore >= enemyScore) window.myWins++;
    else window.enemyWins++;

    document.querySelector(".modal > div").innerHTML = `
      <h2>⚔️ DUELO TÁCTICO - Ronda 3 (Final)</h2>
      <p>Parciales contra ${eNick}: Tú (${window.myWins}) - Rival (${window.enemyWins})</p>
      <p>Selecciona tu carta para la <b>Ronda Definitiva</b>:</p>
      <select id="roundCardSelect">${cardOptions}</select><br><br>
      <button onclick="window.finalizeBattle('${eEmail}', '${eTeam}', '${eNick}')">¡Ver Resultado Final! 🏆</button>
    `;
  };

  window.finalizeBattle = async function(eEmail, eTeam, eNick) {
    const sel = parseInt(document.getElementById("roundCardSelect").value);
    let myScore = 30;
    if(sel >= 0 && window.storedCards[sel]) {
      myScore = window.storedCards[sel].attack + window.storedCards[sel].defense;
    }
    const enemyScore = Math.floor(Math.random() * 140) + 20;

    if(myScore >= enemyScore) window.myWins++;
    else window.enemyWins++;

    modal.remove();

    if(window.myWins > window.enemyWins) {
      let pointsWon = 150;
      if(STATE.playerLevel >= 2) pointsWon = 180; // Multiplicador de XP

      swal("✨ ¡VICTORIA TOTAL EN DUELO! ✨", `Has ganado ${window.myWins} de 3 rondas contra ${eNick}. ¡Has sumado +${pointsWon} puntos para tu equipo!`, "success");
      
      const scoreKey = STATE.team === 'red' ? 'red_score' : 'blue_score';
      const { data: currentRoom } = await supabase.from('rooms').select(scoreKey).eq('code', STATE.roomCode).single();
      if(currentRoom) {
        const newScore = (currentRoom[scoreKey] || 0) + pointsWon;
        await supabase.from('rooms').update({ [scoreKey]: newScore }).eq('code', STATE.roomCode);
      }
    } else {
      swal("DERROTA EN EL DUELO TÁCTICO 💔", `${eNick} ganó ${window.enemyWins} de 3 rondas. ¡Evoluciona tus cartas explorando más el mapa!`, "error");
    }
  };
}

function startTimer(durationSeconds){
  if(timerInterval) clearInterval(timerInterval);
  let timer = durationSeconds;
  const display = document.getElementById("timer");
  
  timerInterval = setInterval(async () => {
    let minutes = parseInt(timer / 60, 10);
    let seconds = parseInt(timer % 60, 10);

    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;

    display.textContent = minutes + ":" + seconds;

    if (--timer < 0) {
      clearInterval(timerInterval);
      
      const { data: roomData } = await supabase
        .from('rooms')
        .select('red_score, blue_score')
        .eq('code', STATE.roomCode)
        .single();

      const red = roomData ? (roomData.red_score || 0) : 0;
      const blue = roomData ? (roomData.blue_score || 0) : 0;

      let winnerMsg = "¡HAY UN EMPATE! 🤝";
      if(red > blue) winnerMsg = "🏆 ¡EL EQUIPO ROJO 🔴 HA GANADO LA PARTIDA!";
      else if(blue > red) winnerMsg = "🏆 ¡EL EQUIPO AZUL 🔵 HA GANADO LA PARTIDA!";

      swal({
        title: "¡Partida Finalizada! ⏳",
        text: `${winnerMsg}\n\nPuntuación Final:\n🔴 Equipo Rojo: ${red} pts\n🔵 Equipo Azul: ${blue} pts`,
        icon: "info",
        button: "Volver al Lobby 🚀"
      }).then(() => {
        window.location.reload();
      });
    }
  }, 1000);
}

function listenRoomChanges(){
  supabase
    .channel('room-channel')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `code=eq.${STATE.roomCode}` }, payload => {
      if(payload.new.red_score !== undefined) document.getElementById("redScore").innerText = payload.new.red_score;
      if(payload.new.blue_score !== undefined) document.getElementById("blueScore").innerText = payload.new.blue_score;
    })
    .subscribe();
}

function setupRealtimePresence() {
  roomChannel = supabase.channel(`room-presence-${STATE.roomCode}`, {
    config: { presence: { key: STATE.user.email } }
  });

  roomChannel
    .on('presence', { event: 'sync' }, () => {
      const state = roomChannel.presenceState();
      updatePlayerMarkers(state);
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await roomChannel.track({
          nick: STATE.user.nick,
          lat: STATE.userLat,
          lng: STATE.userLng,
          team: STATE.team,
          level: STATE.playerLevel,
          online_at: new Date().toISOString()
        });
      }
    });
}

document.getElementById("btnInventory").addEventListener("click", async () => {
  const { data, error } = await supabase
    .from('player_cards')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email);

  if(error || !data || !data.length){ 
    swal("Inventario vacío", "Aún no has capturado ninguna carta en el mapa.", "info"); 
    return; 
  }

  let html = `<h3>Tus Cartas Coleccionadas</h3><div style="max-height:250px; overflow-y:auto; text-align:left;">`;
  data.forEach(card => {
    let tier = "🟢 Común";
    let total = card.attack + card.defense;
    if(total > 180) tier = "🔥 ¡LEGENDARIA!";
    else if(total > 140) tier = "🟣 Épica";
    else if(total > 100) tier = "🔵 Rara";

    html += `<div style="border:1px solid rgba(255,255,255,0.15); background:rgba(255,255,255,0.05); padding:8px; margin:5px; border-radius:8px;">
      <b>${card.card_name}</b> <span style="font-size:11px; float:right;">${tier}</span><br>
      ⚔️ Ataque: ${card.attack} | 🛡️ Defensa: ${card.defense}
    </div>`;
  });
  html += `</div>`;
  
  const div = document.createElement("div");
  div.className = "modal";
  div.innerHTML = `<div>${html}<br><button onclick="this.closest('.modal').remove()">Cerrar</button></div>`;
  document.body.appendChild(div);
});

document.getElementById("btnExit").addEventListener("click", () => {
  if (STATE.watchPositionId) navigator.geolocation.clearWatch(STATE.watchPositionId);
  if (roomChannel) supabase.removeChannel(roomChannel);
  window.location.reload();
});
</script>
