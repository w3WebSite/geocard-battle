function getDistanceInMeters(lat1, lon1, lat2, lon2) {  
  const R = 6371000;  
  const dLat = (lat2 - lat1) * Math.PI / 180;  
  const dLon = (lon2 - lon1) * Math.PI / 180;  
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);  
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

async function loadAdminRoomsList() {  
  const { data: rooms, error } = await supabase.from('rooms').select('*').order('code', { ascending: true });  
  const container = document.getElementById("adminRoomsList");
  if(!container) return;

  if(error || !rooms || rooms.length === 0) {    
    container.innerHTML = "<p style='color:#94a3b8; font-size:13px;'>No hay salas creadas todavía.</p>";    
    return;  }

  let html = "";  
  rooms.forEach(r => {    
    html += `      
      <div class="room-item">        
        <span><b>🔑 ${r.code}</b> (${r.duration || 30} min)</span>        
        <div>          
          <button class="btn-enter" onclick="window.adminEnterRoom('${r.code}', ${r.duration || 30})">Entrar</button>          
          <button class="btn-delete" onclick="window.adminDeleteRoom('${r.code}')">Eliminar</button>        
        </div>      
      </div>    `;  
  });  
  container.innerHTML = html;
}

window.createNewRoom = async function() {  
  const code = document.getElementById("adminRoomCodeInput").value.trim().toUpperCase();  
  const duration = parseInt(document.getElementById("adminDurationInput").value) || 30;

  if(!code) {    
    swal("Error", "Introduce un código de sala válido", "warning");    
    return;  }

  const { error } = await supabase.from('rooms').upsert({    
    code: code,    
    active: true,    
    duration: duration
  }, { onConflict: 'code' });

  if(error) {    
    swal("Error", "No se pudo crear la sala en la base de datos", "error");    
    return;
  }

  for (let i = 0; i < 5; i++) {

// Redimensionar imagen Base64 para optimizar sincronización en tiempo real
function compressImage(file, maxWidth = 120, maxHeight = 120) {
  return new Promise((resolve) => {
    const reader = new FileReader();
    reader.onload = (event) => {
      const img = new Image();
      img.onload = () => {
        const canvas = document.createElement('canvas');
        let width = img.width;
        let height = img.height;
        if (width > height) {
          if (width > maxWidth) { height *= maxWidth / width; width = maxWidth; }
        } else {
          if (height > maxHeight) { width *= maxHeight / height; height = maxHeight; }
        }
        canvas.width = width;
        canvas.height = height;
        const ctx = canvas.getContext('2d');
        ctx.drawImage(img, 0, 0, width, height);
        resolve(canvas.toDataURL('image/jpeg', 0.7));
      };
      img.src = event.target.result;
    };
    reader.readAsDataURL(file);
  });
}

// 🗺️ Inicialización del mapa
function initMap() {
  if (STATE.mapInitialized) return;

  STATE.standardLayer = L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19,
    attribution: '&copy; OpenStreetMap contributors'
  });

  STATE.satelliteLayer = L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', {
    maxZoom: 19,
    attribution: 'Tiles &copy; Esri'
  });

  STATE.map = L.map('map', {
    center: [STATE.userLat, STATE.userLng],
    zoom: 16,

async function loadGeocachesFromSupabase() {
  const { data: caches, error } = await supabase
    .from('geocaches')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('claimed', false);

  if (error) return;
  if (caches) caches.forEach(cache => renderGeocacheMarker(cache));
}

function renderGeocacheMarker(cache) {
  if (mapMarkersList[cache.id]) return;

  const customIcon = L.divIcon({
    className: 'custom-div-icon',
    html: `<div class="modernCardMarker">🎴</div>`,
    iconSize: [36, 48],
    iconAnchor: [18, 48]
  });

  const marker = L.marker([cache.lat, cache.lng], { icon: customIcon }).addTo(STATE.map);

  marker.on('click', (e) => {
    L.DomEvent.stopPropagation(e);
    attemptCollectGeocache(cache);
  });

  mapMarkersList[cache.id] = marker;
}

async function attemptCollectGeocache(cache) {
  const distance = getDistanceInMeters(STATE.userLat, STATE.userLng, cache.lat, cache.lng);

  if (distance > 30) {
    swal("Demasiado lejos 🏃", `Estás a ${Math.round(distance)} metros de esta carta.`, "warning");
    return;
  }

  await supabase.from('geocaches').update({ claimed: true }).eq('id', cache.id);

  if (mapMarkersList[cache.id]) {
    STATE.map.removeLayer(mapMarkersList[cache.id]);
    delete mapMarkersList[cache.id];
  }

  const { data: existingCards } = await supabase
    .from('player_cards')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email)
    .eq('card_name', cache.card_name);

  if (existingCards && existingCards.length > 0) {
    const cardToUpgrade = existingCards[0];
    const newEvolution = (cardToUpgrade.evolution || 1) + 1;
    const newAtk = cardToUpgrade.attack + 15;
    const newDef = cardToUpgrade.defense + 15;

    await supabase.from('player_cards')
      .update({ evolution: newEvolution, attack: newAtk, defense: newDef })
      .eq('id', cardToUpgrade.id);

    swal("¡CARTA EVOLUCIONADA! ⭐🔥", `¡Has capturado otro ejemplar de ${cache.card_name}!\nSu nivel de evolución sube a ⭐${newEvolution}\n⚔️ ATK: ${newAtk} | 🛡️ DEF: ${newDef}`, "success");
  } else {
    await supabase.from('player_cards').insert({
      room_code: STATE.roomCode,
      user_email: STATE.user.email,
      card_name: cache.card_name,
      attack: cache.attack,
      defense: cache.defense,
      evolution: 1,
      image_url: cache.image_url || ''
    });

    swal("¡Carta Capturada! 🎴🎉", `Has conseguido: ${cache.card_name}\n⚔️ ATK: ${cache.attack} | 🛡️ DEF: ${cache.defense}`, "success");
  }

  STATE.cardsCaptured++;
  checkPlayerLevelProgression();
}

function listenGeocacheChanges() {
  supabase.channel('public:geocaches_' + STATE.roomCode)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'geocaches', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      renderGeocacheMarker(payload.new);
    })
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'geocaches', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      if (payload.new.claimed && mapMarkersList[payload.new.id]) {
        STATE.map.removeLayer(mapMarkersList[payload.new.id]);
        delete mapMarkersList[payload.new.id];
      }
    })
    .subscribe();
}

function startTimer(durationInSeconds) {
  let timer = durationInSeconds;
  const display = document.getElementById('timer');
  if (timerInterval) clearInterval(timerInterval);

  timerInterval = setInterval(() => {
    let minutes = parseInt(timer / 60, 10);
    let seconds = parseInt(timer % 60, 10);
    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;
    if(display) display.textContent = minutes + ":" + seconds;
    if (--timer < 0) {
      clearInterval(timerInterval);
      swal("¡Partida Finalizada! 🏁", "El tiempo ha terminado.", "info");
    }
  }, 1000);
}

function checkPlayerLevelProgression() {
  STATE.playerLevel = Math.floor(STATE.cardsCaptured / 5) + 1;
  let currentXpInLevel = STATE.cardsCaptured % 5;
  const xpDisplay = document.getElementById("playerXpDisplay");
  if(xpDisplay) {
    xpDisplay.innerText = `Nivel ${STATE.playerLevel} (${currentXpInLevel}/5)`;
  }
}

// 👥 CONTROL DE PRESENCIA Y RENDERIZADO GLOBAL DE JUGADORES
function setupRealtimePresence(){  
  roomChannel = supabase.channel('room_' + STATE.roomCode, {    
    config: { presence: { key: STATE.user.email } }  
  });

  roomChannel    
    .on('presence', { event: 'sync' }, () => {      
      currentPresenceState = roomChannel.presenceState();      
      updateOnlinePlayersCount(currentPresenceState);      
      renderAllPlayersOnMap(currentPresenceState);
      checkNearbyPlayersForBattle(currentPresenceState);
    })    
    .subscribe(async (status) => {      
      if (status === 'SUBSCRIBED') {        
        await roomChannel.track({          
          email: STATE.user.email,          
          session: SESSION_ID,          
          nick: STATE.user.nick,
          playerClass: STATE.user.playerClass,
          avatar: STATE.user.avatarUrl,
          lat: STATE.userLat,             
          lng: STATE.userLng,          
          victories: STATE.victories,
          cardsCount: STATE.cardsCaptured,          
          level: STATE.playerLevel,          
          online_at: new Date().toISOString()
        });      
      }    
    });
}

function updateOnlinePlayersCount(state) {  
  let count = 0;  
  Object.keys(state).forEach(key => { count += state[key].length; });  
  document.getElementById("onlineCount").innerText = count;
}

// 👥 DIBUJAR JUGADORES EN EL MAPA EN TIEMPO REAL
function renderAllPlayersOnMap(presenceState) {
  const activeEmails = [];

  Object.keys(presenceState).forEach(key => {
    const presences = presenceState[key];
    presences.forEach(p => {
      activeEmails.push(p.email);

      // Si es la propia marca del jugador local, se actualiza en su función GPS principal
      if (p.email === STATE.user.email) return;

      const avatarStyle = p.avatar 
        ? `background-image: url('${p.avatar}');` 
        : `background: #2a9d8f; display:flex; justify-content:center; align-items:center; font-size:18px;`;

      const avatarContent = p.avatar ? '' : '👤';

      const customPlayerIcon = L.divIcon({
        className: 'custom-player-avatar',
        html: `<div class="player-avatar-icon" style="${avatarStyle}">${avatarContent}</div>`,
        iconSize: [44, 44],
        iconAnchor: [22, 22]
      });

      if (playerMarkers[p.email]) {
        playerMarkers[p.email].setLatLng([p.lat, p.lng]);
        playerMarkers[p.email].playerData = p;
      } else {
        const marker = L.marker([p.lat, p.lng], { icon: customPlayerIcon }).addTo(STATE.map);
        marker.playerData = p;
        
        marker.on('click', (e) => {
          L.DomEvent.stopPropagation(e);
          showPlayerProfileModal(marker.playerData);
        });

        playerMarkers[p.email] = marker;
      }
    });
  });

  // Limpiar marcadores de usuarios desconectados
  Object.keys(playerMarkers).forEach(email => {
    if (!activeEmails.includes(email)) {
      STATE.map.removeLayer(playerMarkers[email]);
      delete playerMarkers[email];
    }
  });
}

function checkNearbyPlayersForBattle(presenceState) {  
  if (STATE.inBattle) return;
  const now = Date.now();  
  if (now - STATE.lastBattleTime < 45000) return;

  Object.keys(presenceState).forEach(clientId => {    
    const presences = presenceState[clientId];    
    presences.forEach(p => {      
      if (p.email !== STATE.user.email) {        
        const distance = getDistanceInMeters(STATE.userLat, STATE.userLng, p.lat, p.lng);                
        if (distance <= 15 && STATE.lastEnemyBattled !== p.email) {          
          STATE.lastBattleTime = now;          
          STATE.lastEnemyBattled = p.email;          
          promptBattleConsent(p);        }      }    });  });
}

function promptBattleConsent(enemy) {  
  swal({    
    title: "⚔️ ¡Duelo Táctico Detectado!",    
    text: `Te has cruzado con ${enemy.nick} a menos de 15m.\n¿Aceptas el duelo PvP a 3 turnos?`,    
    icon: "warning",    
    buttons: {      
      cancel: "🏃 Huir",      
      accept: { text: "⚔️ ¡Aceptar Duelo!", value: "accept" },    },  }).then((value) => {    
    if (value === "accept") {      
      startBattle3Turns(enemy);    } else {      
      swal("Has huido 💨", "Te has retirado de la zona.", "info");    }  });
}

// ⚔️ SISTEMA DE BATALLA TÁCTICA A 3 TURNOS
async function startBattle3Turns(enemy) {
  STATE.inBattle = true;

  const { data: myCards } = await supabase    
    .from('player_cards')    
    .select('*')    
    .eq('room_code', STATE.roomCode)    
    .eq('user_email', STATE.user.email);

  let mazo = myCards && myCards.length > 0 ? myCards : [DEFAULT_STARTER_CARD];

  let battleState = {
    round: 1,
    myWins: 0,
    enemyWins: 0,
    enemy: enemy,
    mazo: mazo
  };

  runBattleRound(battleState);
}

async function runBattleRound(bs) {
  if (bs.round > 3 || bs.myWins >= 2 || bs.enemyWins >= 2) {
    endBattleSession(bs);
    return;
  }

  let cardsHTML = "";  
  bs.mazo.forEach((c, idx) => {    
    cardsHTML += `      
      <div class="battle-card-option" onclick="window.selectCardForRound(${idx})">        
        <b>🎴 ${c.card_name}</b> (⭐${c.evolution || 1})<br>        
        <span style="font-size:12px; color:#cbd5e1;">⚔️ ATK: ${c.attack} | 🛡️ DEF: ${c.defense}</span>      
      </div>    `;  });

  const battleModal = document.createElement("div");  
  battleModal.className = "modal";  
  battleModal.id = "roundBattleModal";
  battleModal.innerHTML = `    
    <div>      
      <h2>⚔️ DUELO PVP - RONDA ${bs.round} / 3</h2>      
      <p style="font-size:13px; color:#cbd5e1;">Rival: <b>${bs.enemy.nick}</b> | Tù: ${bs.myWins} - ${bs.enemyWins} :Rival</p>      
      <p style="font-size:12px; color:#e9c46a;">Elige tu carta para este turno:</p>      
      <div style="max-height:220px; overflow-y:auto;">${cardsHTML}</div>    
    </div>  `;

  document.body.appendChild(battleModal);
  window.currentBattleSession = bs;
}

window.selectCardForRound = function(cardIdx) {
  const bs = window.currentBattleSession;
  const modal = document.getElementById("roundBattleModal");
  if (modal) modal.remove();

  const chosenCard = bs.mazo[cardIdx];
  let attackBonus = STATE.user.playerClass.includes("Guerrero") ? 15 : 0;  
  let defenseBonus = STATE.user.playerClass.includes("Guardián") ? 15 : 0;
  let myPower = chosenCard.attack + chosenCard.defense + attackBonus + defenseBonus;

  let enemyPower = Math.floor(Math.random() * 90) + 50;

  if (myPower >= enemyPower) {
    bs.myWins++;
    swal(`🔥 ¡Victoria en Ronda ${bs.round}!`, `Tu ${chosenCard.card_name} (${myPower}) superó al rival (${enemyPower}).`, "success")
      .then(() => { bs.round++; runBattleRound(bs); });
  } else {
    bs.enemyWins++;
    swal(`💔 Derrota en Ronda ${bs.round}`, `Tu ${chosenCard.card_name} (${myPower}) fue superada (${enemyPower}).`, "error")
      .then(() => { bs.round++; runBattleRound(bs); });
  }
};

async function endBattleSession(bs) {
  STATE.inBattle = false;

  if (bs.myWins > bs.enemyWins) {
    STATE.victories++;
    document.getElementById("winsDisplay").innerText = STATE.victories;

    // Actualizar presencia con la nueva victoria
    if (roomChannel) {
      roomChannel.track({
        email: STATE.user.email,
        session: SESSION_ID,
        nick: STATE.user.nick,
        playerClass: STATE.user.playerClass,
        avatar: STATE.user.avatarUrl,
        lat: STATE.userLat,
        lng: STATE.userLng,
        victories: STATE.victories,
        cardsCount: STATE.cardsCaptured,
        level: STATE.playerLevel,
        online_at: new Date().toISOString()
      });
    }

    swal("🏆 ¡VICTORIA GENERAL DEL DUELO! 🎉", `Has ganado ${bs.myWins} de 3 rondas contra ${bs.enemy.nick}.\n\n+1 Victoria agregada a tu Ranking.`, "success");
  } else {
    swal("💀 DERROTA EN EL DUELO", `${bs.enemy.nick} se ha llevado la victoria (${bs.enemyWins} a ${bs.myWins}). ¡Entrena mejor tus cartas!`, "error");
  }
}

async function loadChatMessages() {  
  const { data } = await supabase    
    .from('geocard_mensajes')    
    .select('*')    
    .eq('room_code', STATE.roomCode)    
    .order('created_at', { ascending: true })    
    .limit(30);

  const container = document.getElementById("chatMessages");  
  container.innerHTML = "";  
  if(data) {    
    data.forEach(m => {
      const msgTime = new Date(m.created_at).getTime();
      if (Date.now() - msgTime < 60000) appendChatMessage(m, false);
    });  
  }
}

function listenChatMessages() {  
  supabase.channel('public:geocard_mensajes_' + STATE.roomCode)    
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'geocard_mensajes', filter: `room_code=eq.${STATE.roomCode}` }, payload => {      
      appendChatMessage(payload.new, true);    })    
    .subscribe();
}

async function sendChatMessage() {  
  const input = document.getElementById("chatInput");  
  const text = input.value.trim();  
  if(!text) return;

  await supabase.from('geocard_mensajes').insert({    
    room_code: STATE.roomCode,    
    nick: STATE.user.nick,    
    message: text  });

  input.value = "";
}

function escapeHtml(text) {
  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#039;' };
  return text.replace(/[&<>"']/g, m => map[m]);
}

function appendChatMessage(m, isNew = false) {  
  const container = document.getElementById("chatMessages");  
  
  const div = document.createElement("div");  
  div.style.marginBottom = "4px";  
  div.style.transition = "opacity 0.5s ease";  
  div.innerHTML = `<b style="color:#38bdf8;">${m.nick}:</b> ${escapeHtml(m.message)}`;  
  
  container.appendChild(div);  
  container.scrollTop = container.scrollHeight;

  if (isNew && !isChatModalOpen) {
    unreadMessagesCount++;
    updateChatBadge();
  }

  setTimeout(() => {
    div.style.opacity = '0';
    setTimeout(() => div.remove(), 500);
  }, 60000);
}

function startGeolocationTracking() {
  if ("geolocation" in navigator) {
    STATE.watchPositionId = navigator.geolocation.watchPosition(
      position => {
        STATE.userLat = position.coords.latitude;
        STATE.userLng = position.coords.longitude;
        
        const avatarHtml = STATE.user.avatarUrl 
          ? `<div class="player-avatar-icon" style="background-image: url('${STATE.user.avatarUrl}')"></div>` 
          : `<div class="player-avatar-icon" style="background: #2a9d8f; display:flex; justify-content:center; align-items:center;">📍</div>`;

        const userCustomIcon = L.divIcon({
          className: 'custom-user-icon',
          html: avatarHtml,
          iconSize: [44, 44],
          iconAnchor: [22, 22]
        });

        if (STATE.map && STATE.userMarker) {
          STATE.userMarker.setLatLng([STATE.userLat, STATE.userLng]);
          if (STATE.rangeCircle) STATE.rangeCircle.setLatLng([STATE.userLat, STATE.userLng]);
        } else if (STATE.map) {
          STATE.userMarker = L.marker([STATE.userLat, STATE.userLng], { icon: userCustomIcon }).addTo(STATE.map).bindPopup("¡Estás aquí!");
          STATE.rangeCircle = L.circle([STATE.userLat, STATE.userLng], { radius: 15, color: '#2a9d8f', fillColor: '#2a9d8f', fillOpacity: 0.15 }).addTo(STATE.map);
          STATE.map.setView([STATE.userLat, STATE.userLng], 16);
        }

        // Emitir posición actualizada a todos en tiempo real
        if (roomChannel) {
          roomChannel.track({
            email: STATE.user.email,
            session: SESSION_ID,
            nick: STATE.user.nick,
            playerClass: STATE.user.playerClass,
            avatar: STATE.user.avatarUrl,
            lat: STATE.userLat,
            lng: STATE.userLng,
            victories: STATE.victories,
            cardsCount: STATE.cardsCaptured,
            level: STATE.playerLevel,
            online_at: new Date().toISOString()
          });
        }
      },
      error => console.error("Error GPS:", error),
      { enableHighAccuracy: true, maximumAge: 5000, timeout: 10000 }
    );
  }
}
