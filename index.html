function getDistanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

async function loadAdminRoomsList() {
  const { data: rooms, error } = await supabase.from('rooms').select('*').order('code', { ascending: true });
  const container = document.getElementById("adminRoomsList");
  if(!container) return;

  if(error || !rooms || rooms.length === 0) {
    container.innerHTML = "<p style='color:#94a3b8; font-size:13px;'>No hay salas creadas todavía.</p>";
    return;
  }

  let html = "";
  rooms.forEach(r => {
    html += `
      <div class="room-item">
        <span><b>🔑 ${r.code}</b> (${r.duration || 30} min)</span>
        <div>
          <button class="btn-enter" onclick="window.adminEnterRoom('${r.code}', ${r.duration || 30})">Entrar</button>
          <button class="btn-delete" onclick="window.adminDeleteRoom('${r.code}')">Eliminar</button>
        </div>
      </div>
    `;
  });
  container.innerHTML = html;
}

window.createNewRoom = async function() {
  const code = document.getElementById("adminRoomCodeInput").value.trim().toUpperCase();
  const duration = parseInt(document.getElementById("adminDurationInput").value) || 30;

  if(!code) {
    swal("Error", "Introduce un código de sala válido", "warning");
    return;
  }

  const { error } = await supabase.from('rooms').upsert({
    code: code,
    active: true,
    duration: duration,
    red_score: 0,
    blue_score: 0
  }, { onConflict: 'code' });

  if(error) {
    swal("Error", "No se pudo crear la sala en la base de datos", "error");
  } else {
    swal("¡Sala Lista! 🎉", `La sala "${code}" ha sido creada correctamente.`, "success");
    document.getElementById("adminRoomCodeInput").value = "";
    loadAdminRoomsList();
  }
};

window.adminDeleteRoom = async function(code) {
  swal({
    title: `¿Eliminar sala ${code}?`,
    text: "Esto borrará la sala y todos sus datos de la base de datos.",
    icon: "warning",
    buttons: ["Cancelar", "Sí, eliminar"],
    dangerMode: true,
  }).then(async (willDelete) => {
    if (willDelete) {
      await supabase.from('geocaches').delete().eq('room_code', code);
      await supabase.from('player_cards').delete().eq('room_code', code);
      await supabase.from('geocard_mensajes').delete().eq('room_code', code);
      const { error } = await supabase.from('rooms').delete().eq('code', code);

      if(error) {
        swal("Error", "No se pudo eliminar la sala", "error");
      } else {
        swal("Eliminado", "La sala y sus datos asociados han sido borrados.", "success");
        loadAdminRoomsList();
      }
    }
  });
};

window.processPlayerLogin = async function(){
  const nickInput = document.getElementById("loginNick").value.trim();
  const playerClass = document.getElementById("playerClassSelect").value;
  const roomCodeInput = document.getElementById("playerRoomCode").value.trim().toUpperCase();
  const team = document.getElementById("playerTeamSelect").value;

  if(!nickInput){ swal("Error", "Debes ingresar un Nick para jugar", "warning"); return; }

  if(nickInput.toLowerCase() === ADMIN_KEYWORD.toLowerCase()){
    STATE.isAdmin = true;
    STATE.user.nick = "Administrador";
    STATE.user.email = "admin_paraquelavols@game.com";
    document.getElementById("loginModal").remove();
    showAdminConfigScreen();
    return;
  }

  if(!roomCodeInput){ 
    swal("Falta Código", "Debes ingresar el Código de la Partida", "warning"); 
    return; 
  }

  const { data: roomData, error } = await supabase
    .from('rooms')
    .select('*')
    .eq('code', roomCodeInput)
    .eq('active', true)
    .maybeSingle();

  if(error || !roomData) {
    swal("Sala no encontrada ❌", `La sala "${roomCodeInput}" no existe o el Administrador aún no la ha creado.`, "error");
    return;
  }

  STATE.isAdmin = false;
  STATE.user.nick = nickInput;
  STATE.user.playerClass = playerClass;
  STATE.user.email = `${nickInput.toLowerCase().replace(/\s+/g, '_')}_${roomCodeInput}@game.com`;
  STATE.roomCode = roomCodeInput;
  STATE.team = team;

  const { count, error: countErr } = await supabase
    .from('player_cards')
    .select('*', { count: 'exact', head: true })
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email);

  if(!countErr && count !== null) {
    STATE.cardsCaptured = count;
    STATE.playerLevel = Math.floor(count / 5) + 1;
  } else {
    STATE.cardsCaptured = 0;
    STATE.playerLevel = 1;
  }

  document.getElementById("redScore").innerText = roomData.red_score || 0;
  document.getElementById("blueScore").innerText = roomData.blue_score || 0;

  document.getElementById("loginModal").remove();
  launchGameEngine(roomData.duration || 30);
};

    swal("Error", "No se pudo cargar tu inventario", "error");
    return;

  if(myCards && myCards.length > 0) {
    myCards.forEach(c => {
      let tier = "🟢 Común";

    cardsHTML = "<p style='color:#94a3b8; font-size:13px;'>Aún no has conseguido ninguna carta en esta partida. ¡Sal a capturarlas al mapa!</p>";
  }

  const invModal = document.createElement("div");
  invModal.className = "modal";

      <p style="font-size:12px; color:#38bdf8; margin-bottom:10px;">Total capturadas: ${STATE.cardsCaptured} | Nivel: ${STATE.playerLevel}</p>
      <div style="max-height:280px; overflow-y:auto; padding-right:5px;">${cardsHTML}</div><br>
      <button onclick="document.getElementById('inventoryModal').remove()">Cerrar ✖️</button>
    </div>
  `;
  document.body.appendChild(invModal);
}

function launchGameEngine(durationMinutes){
  document.getElementById("panel").style.display = "block";
  document.getElementById("btnExit").style.display = "inline-block";
  document.getElementById("timerContainer").style.display = "block";
  document.getElementById("chatContainer").style.display = "flex";

  initMap();
  setupRealtimePresence();
  startGeolocationTracking();
  loadGeocachesFromSupabase();
  listenRoomChanges();
  listenGeocacheChanges();
  loadChatMessages();
  listenChatMessages();
  startTimer(durationMinutes * 60);
  checkPlayerLevelProgression();
}

// ==========================================
// SISTEMA DE COMBATE EN TIEMPO REAL (PVP)
// ==========================================
function setupRealtimePresence(){
  roomChannel = supabase.channel('room_' + STATE.roomCode, {
    config: { presence: { key: STATE.user.email } }
  });

  roomChannel
    .on('presence', { event: 'sync' }, () => {
      const state = roomChannel.presenceState();
      updateOnlinePlayersCount(state);
      checkNearbyPlayersForBattle(state);
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await roomChannel.track({
          email: STATE.user.email,
          session: SESSION_ID,
          nick: `${STATE.user.nick} (${STATE.user.playerClass})`,
          lat: STATE.userLat, 
          lng: STATE.userLng,
          team: STATE.team, 
          cardsCount: STATE.cardsCaptured,
          level: STATE.playerLevel,
          online_at: new Date().toISOString()
        });
      }
    });
}

function updateOnlinePlayersCount(state) {
  let count = 0;
  Object.keys(state).forEach(key => {
    count += state[key].length;
  });
  document.getElementById("onlineCount").innerText = count;
}

function checkNearbyPlayersForBattle(presenceState) {
  if (STATE.inBattle) return;

  const now = Date.now();
  if (now - STATE.lastBattleTime < 45000) return;

  Object.keys(presenceState).forEach(clientId => {
    const presences = presenceState[clientId];
    presences.forEach(p => {
      if (p.email !== STATE.user.email && p.team !== STATE.team) {
        const distance = getDistanceInMeters(STATE.userLat, STATE.userLng, p.lat, p.lng);
        
        if (distance <= 15 && STATE.lastEnemyBattled !== p.email) {
          STATE.lastBattleTime = now;
          STATE.lastEnemyBattled = p.email;
          promptBattleConsent(p);
        }
      }
    });
  });
}

function promptBattleConsent(enemy) {
  swal({
    title: "⚔️ ¡Duelo Cercano Detectado!",
    text: `Te has cruzado con el rival ${enemy.nick} a menos de 15 metros.\n¿Deseas aceptar el combate PvP o rechazar y huir?`,
    icon: "warning",
    buttons: {
      cancel: "🏃 Huir / Rechazar",
      accept: {
        text: "⚔️ ¡Aceptar Batalla!",
        value: "accept",
      },
    },
  }).then((value) => {
    if (value === "accept") {
      openBattleCardSelectionModal(enemy);
    } else {
      swal("Has huido con éxito 💨", "Te has retirado de la zona de combate de forma segura.", "info");
    }
  });
}

// 🎴 Seleccionar carta para el combate (o usar carta por defecto)
async function openBattleCardSelectionModal(enemy) {
  STATE.inBattle = true;

  const { data: myCards } = await supabase
    .from('player_cards')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email);

  let cardsToSelect = myCards && myCards.length > 0 ? myCards : [DEFAULT_STARTER_CARD];

  const battleModal = document.createElement("div");
  battleModal.className = "modal";
  battleModal.id = "battleModal";

  let cardsHTML = "";
  cardsToSelect.forEach((c, idx) => {
    cardsHTML += `
      <div class="battle-card-option" onclick="window.confirmCardChoice(${idx})">
        <b>🎴 ${c.card_name}</b><br>
        <span style="font-size:12px; color:#cbd5e1;">⚔️ ATK: ${c.attack} | 🛡️ DEF: ${c.defense}</span>
      </div>
    `;
  });

  battleModal.innerHTML = `
    <div>
      <h2>⚔️ ¡PREPÁRATE PARA EL DUELO!</h2>
      <p style="font-size:13px; color:#cbd5e1;">Combatiendo contra: <b>${enemy.nick}</b></p>
      <p style="font-size:12px; color:#e9c46a;">Elige una carta de tu mazo para luchar:</p>
      <div style="max-height:250px; overflow-y:auto;">${cardsHTML}</div>
    </div>
  `;

  document.body.appendChild(battleModal);
  window.currentBattleCards = cardsToSelect;
  window.currentEnemy = enemy;
}

window.confirmCardChoice = async function(cardIdx) {
  const chosenCard = window.currentBattleCards[cardIdx];
  const enemy = window.currentEnemy;
  const modal = document.getElementById("battleModal");
  if (modal) modal.remove();

  // Bonificación por clase
  let attackBonus = STATE.user.playerClass.includes("Guerrero") ? 15 : 0;
  let defenseBonus = STATE.user.playerClass.includes("Guardián") ? 15 : 0;

  let myTotalPower = chosenCard.attack + chosenCard.defense + attackBonus + defenseBonus;
  
  // Simulación de respuesta enemiga (potencia aleatoria basada en nivel/cartas)
  let enemyPower = Math.floor(Math.random() * 80) + 60; 

  if (myTotalPower >= enemyPower) {
    // 🏆 VICTORIA
    STATE.cardsCaptured++;
    checkPlayerLevelProgression();
    
    // Sumar 1 punto al contador del equipo en Supabase
    const scoreField = STATE.team === 'red' ? 'red_score' : 'blue_score';
    const currentScore = parseInt(document.getElementById(STATE.team + "Score").innerText) || 0;
    
    await supabase.from('rooms').update({ [scoreField]: currentScore + 1 }).eq('code', STATE.roomCode);

    swal("🔥 ¡VICTORIA EN COMBATE! 🏆", `Tu ${chosenCard.card_name} (Poder: ${myTotalPower}) ha superado a ${enemy.nick} (Poder: ${enemyPower}).\n\n+1 Punto para tu equipo y +1 de XP.`, "success");
  } else {
    // 💀 DERROTA
    swal("💔 DERROTA EN COMBATE", `Tu ${chosenCard.card_name} (Poder: ${myTotalPower}) fue superada por ${enemy.nick} (Poder: ${enemyPower}).\n\nTienes un escudo de protección de 45 segundos.`, "error");
  }

  STATE.inBattle = false;
};

async function loadChatMessages() {
  const { data } = await supabase
    .from('geocard_mensajes')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .order('created_at', { ascending: true })
    .limit(30);

  const container = document.getElementById("chatMessages");
  container.innerHTML = "";
  if(data) {
    data.forEach(m => appendChatMessage(m));
  }
}

function listenChatMessages() {
  supabase.channel('public:geocard_mensajes_' + STATE.roomCode)
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'geocard_mensajes', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      appendChatMessage(payload.new);
    })
    .subscribe();
}

async function sendChatMessage() {
  const input = document.getElementById("chatInput");
  const text = input.value.trim();
  if(!text) return;

  await supabase.from('geocard_mensajes').insert({
    room_code: STATE.roomCode,
    nick: STATE.user.nick,
    team: STATE.team,
    message: text
  });

  input.value = "";
}

function appendChatMessage(m) {
  const container = document.getElementById("chatMessages");
  const teamColor = m.team === 'red' ? '#e63946' : '#38bdf8';
  
  const div = document.createElement("div");
  div.style.marginBottom = "4px";
  div.style.transition = "opacity 0.5s ease";
  div.innerHTML = `<b style="color:${teamColor};">${m.nick}:</b> ${escapeHtml(m.message)}`;
  
  container.appendChild(div);
  container.scrollTop = container.scrollHeight;

  setTimeout(() => {
    if (div && div.parentNode) {
      div.style.opacity = "0";
      setTimeout(() => div.remove(), 500);
    }
  }, 60000);
}

function escapeHtml(text) {
  return text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}

function initMap(){
  if(STATE.mapInitialized) return;
  STATE.map = L.map('map').setView([STATE.userLat, STATE.userLng], 13);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(STATE.map);
  STATE.mapInitialized = true;
}

function startGeolocationTracking(){
  if ("geolocation" in navigator) {
    const geoOptions = { enableHighAccuracy: true, timeout: 15000, maximumAge: 0 };
    STATE.watchPositionId = navigator.geolocation.watchPosition(
      (position) => {
        STATE.userLat = position.coords.latitude;
        STATE.userLng = position.coords.longitude;
        updateUserPositionOnMap();
        checkAndSpawnCardsAroundPlayer(); 
      },
      (error) => {
        console.warn("Error de geolocalización:", error.message);
        updateUserPositionOnMap();
      },
      geoOptions
    );
  } else {
    updateUserPositionOnMap();
  }
}

async function checkAndSpawnCardsAroundPlayer() {
  if (!STATE.roomCode) return;

  const { data: nearbyCards } = await supabase
    .from('geocaches')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('claimed', false);

  let closeCount = 0;
  if (nearbyCards) {
    nearbyCards.forEach(c => {
      const dist = getDistanceInMeters(STATE.userLat, STATE.userLng, c.lat, c.lng);
      if (dist < 400) closeCount++;
    });
  }

  if (closeCount < 4) {
    const radiusOffset = 0.001 + Math.random() * 0.0015;
    const angle = Math.random() * 2 * Math.PI;
    const latOffset = radiusOffset * Math.cos(angle);
    const lngOffset = radiusOffset * Math.sin(angle) / Math.cos(STATE.userLat * Math.PI / 180);

    const spawnLat = STATE.userLat + latOffset;
    const spawnLng = STATE.userLng + lngOffset;

    const randomTemplate = CARD_POOL[Math.floor(Math.random() * CARD_POOL.length)];

    await supabase.from('geocaches').insert({
      room_code: STATE.roomCode,
      lat: spawnLat,
      lng: spawnLng,
      claimed: false,
      card_name: randomTemplate.name,
      card_type: randomTemplate.type || "Ataque",
      attack: randomTemplate.attack,
      defense: randomTemplate.defense,
      image_url: ""
    });
    
    loadGeocachesFromSupabase();
  }
}

function updateUserPositionOnMap(){
  if(!STATE.map) return;

  const color = STATE.team === 'red' ? '#e63946' : '#1d3557';
  let glowStyle = "box-shadow:0 0 10px rgba(0,0,0,0.6);";
  let badgeHTML = "";
  
  if(STATE.playerLevel >= 2) {
    const colorsList = ['#e9c46a', '#38bdf8', '#a855f7', '#ec4899', '#22c55e', '#f97316'];
    const badgeColor = colorsList[(STATE.playerLevel - 2) % colorsList.length];
    
    glowStyle = `box-shadow: 0 0 ${14 + STATE.playerLevel}px ${badgeColor}, 0 0 25px ${color}; border: 3px solid ${badgeColor};`;
    badgeHTML = `<div style="position:absolute; top:-12px; right:-12px; background:${badgeColor}; color:#073b4c; font-size:10px; font-weight:bold; padding:1px 4px; border-radius:6px; border:1px solid white;">⭐L${STATE.playerLevel}</div>`;
  }

  const playerIcon = L.divIcon({
    className: "my-position-icon",
    html: `<div style="position:relative; background:${color}; width:22px; height:22px; border-radius:50%; border:3px solid white; ${glowStyle}">${badgeHTML}</div>`,
    iconSize: [22, 22],
    iconAnchor: [11, 11]
  });

  if(STATE.userMarker){
    STATE.userMarker.setLatLng([STATE.userLat, STATE.userLng]);
    STATE.userMarker.setIcon(playerIcon);
  } else {
    STATE.userMarker = L.marker([STATE.userLat, STATE.userLng], { icon: playerIcon, zIndexOffset: 1000 }).addTo(STATE.map);
    STATE.userMarker.bindPopup(`<b>${STATE.user.nick} (${STATE.user.playerClass})</b><br>Nivel XP: ${STATE.playerLevel}`);
    STATE.map.setView([STATE.userLat, STATE.userLng], 16);
  }

  let circleRadius = 60;
  if(STATE.selectedPerk === 'tank') circleRadius = 85;

  if(STATE.rangeCircle){
    STATE.rangeCircle.setLatLng([STATE.userLat, STATE.userLng]);
    STATE.rangeCircle.setRadius(circleRadius);
  } else {
    STATE.rangeCircle = L.circle([STATE.userLat, STATE.userLng], {
      color: color, fillColor: color, fillOpacity: 0.15, radius: circleRadius
    }).addTo(STATE.map);
  }

  const movedDist = getDistanceInMeters(lastTrackedLat, lastTrackedLng, STATE.userLat, STATE.userLng);
  if(roomChannel && (lastTrackedLat === 0 || movedDist > 5)) {
    lastTrackedLat = STATE.userLat;
    lastTrackedLng = STATE.userLng;
    roomChannel.track({
      email: STATE.user.email,
      session: SESSION_ID,
      nick: `${STATE.user.nick} (${STATE.user.playerClass})`,
      lat: STATE.userLat, 
      lng: STATE.userLng,
      team: STATE.team, 
      cardsCount: STATE.cardsCaptured,
      level: STATE.playerLevel,
      online_at: new Date().toISOString()
    }).catch(err => console.warn("Error tracking presence:", err));
  }
}

async function loadGeocachesFromSupabase(){
  const { data, error } = await supabase
    .from('geocaches')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('claimed', false);

  if(error || !data) return;

  const visibleCacheIds = new Set();

  data.forEach(cache => {
    const distance = getDistanceInMeters(STATE.userLat, STATE.userLng, cache.lat, cache.lng);
    const MAX_VIEW_DISTANCE = 1500;

    if (distance <= MAX_VIEW_DISTANCE) {
      visibleCacheIds.add(cache.id);

      if (mapMarkersList[cache.id]) return;

      const cacheIcon = L.divIcon({
        className: "custom-card-icon",
        html: `<div class="modernCardMarker">🎴</div>`,
        iconSize: [36, 48], iconAnchor: [18, 24]
      });

      const marker = L.marker([cache.lat, cache.lng], { icon: cacheIcon }).addTo(STATE.map);
      mapMarkersList[cache.id] = marker;

      marker.on("click", async () => {
        let maxReach = 80;
        if(STATE.selectedPerk === 'tank') maxReach = 105;

        const clickDistance = getDistanceInMeters(STATE.userLat, STATE.userLng, cache.lat, cache.lng);
        if(clickDistance > maxReach){
          swal("Estás muy lejos (" + Math.round(clickDistance) + "m)", "Entra dentro de tu círculo para reclamar esta carta.", "warning");
          return;
        }

        await supabase.from('geocaches').update({ claimed: true, team: STATE.team }).eq('id', cache.id);

        STATE.cardsCaptured++;
        checkPlayerLevelProgression();

        const randomTemplate = CARD_POOL[Math.floor(Math.random() * CARD_POOL.length)];
        let finalAttack = randomTemplate.attack;
        let finalDefense = randomTemplate.defense;
        if(STATE.selectedPerk === 'berserker') {
          finalAttack += 15;
        }

        const { data: existingCards } = await supabase.from('player_cards').select('*').eq('room_code', STATE.roomCode).eq('user_email', STATE.user.email).eq('card_name', randomTemplate.name);

        if(existingCards && existingCards.length > 0) {
          const cardToUpgrade = existingCards[0];
          const newAttack = cardToUpgrade.attack + 15;
          const newDefense = cardToUpgrade.defense + 15;
          await supabase.from('player_cards').update({ attack: newAttack, defense: newDefense }).eq('id', cardToUpgrade.id);
          swal("✨ ¡CARTA EVOLUCIONADA! ✨", `¡Has encontrado otro "${randomTemplate.name}"!\n⚔️ Ataque: ${newAttack} | 🛡️ Defensa: ${newDefense}`, "success");
        } else {
          await supabase.from('player_cards').insert({
            room_code: STATE.roomCode, team: STATE.team, user_email: STATE.user.email,
            card_name: randomTemplate.name, attack: finalAttack, defense: finalDefense, image_url: ""
          });
          swal("¡Carta Conseguida! 🎴", `Has obtenido por primera vez: ${randomTemplate.name}`, "success");
        }

        if(mapMarkersList[cache.id]) {
          STATE.map.removeLayer(mapMarkersList[cache.id]);
          delete mapMarkersList[cache.id];
        }
      });
    }
  });

  Object.keys(mapMarkersList).forEach(id => {
    if (!visibleCacheIds.has(id)) {
      STATE.map.removeLayer(mapMarkersList[id]);
      delete mapMarkersList[id];
    }
  });
}

function listenGeocacheChanges() {
  supabase.channel('public:geocaches_' + STATE.roomCode)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'geocaches', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      const updatedCache = payload.new;
      if (updatedCache.claimed && mapMarkersList[updatedCache.id]) {
        STATE.map.removeLayer(mapMarkersList[updatedCache.id]);
        delete mapMarkersList[updatedCache.id];
      }
    })
    .on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'geocaches', filter: `room_code=eq.${STATE.roomCode}` }, payload => {
      loadGeocachesFromSupabase();
    })
    .subscribe();
}

function checkPlayerLevelProgression() {
  const xpDisplay = document.getElementById("playerXpDisplay");
  const calculatedLevel = Math.floor(STATE.cardsCaptured / 5) + 1;

  if(calculatedLevel > STATE.playerLevel) {
    STATE.playerLevel = calculatedLevel;
    swal("🌟 ¡SUBIDÓN DE XP! (Nivel " + STATE.playerLevel + ")", "¡Has subido de nivel!", "success");
  }

  const cardsInCurrentLevel = STATE.cardsCaptured % 5;
  if(xpDisplay) {
    xpDisplay.innerText = `Nivel ${STATE.playerLevel} (${cardsInCurrentLevel}/5 para el siguiente)`;
  }
}

function listenRoomChanges() {
  supabase.channel('public:rooms_' + STATE.roomCode)
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `code=eq.${STATE.roomCode}` }, payload => {
      const room = payload.new;
      document.getElementById("redScore").innerText = room.red_score || 0;
      document.getElementById("blueScore").innerText = room.blue_score || 0;
      if(room.active === false) {
        swal("Partida Finalizada", "El administrador ha cerrado la sala.", "info").then(() => {
          location.reload();
        });
      }
    })
    .subscribe();
}

function startTimer(durationSeconds) {
  let timer = durationSeconds;
  const timerDisplay = document.getElementById('timer');

  timerInterval = setInterval(() => {
    let minutes = parseInt(timer / 60, 10);
    let seconds = parseInt(timer % 60, 10);

    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;

    if(timerDisplay) timerDisplay.textContent = minutes + ":" + seconds;

    if (--timer < 0) {
      clearInterval(timerInterval);
      swal("¡Tiempo Agotado! ⌛", "La partida ha finalizado.", "info").then(() => {
        location.reload();
      });
    }
  }, 1000);
}
</script>
