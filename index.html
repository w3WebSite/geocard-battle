function getDistanceInMeters(lat1, lon1, lat2, lon2) {
  const R = 6371000;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) + Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) * Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * (2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a)));
}

function showLobby(){
  const defaultEmail = "jugador_" + Math.floor(Math.random() * 1000) + "@game.com";
  
  const modalDiv = document.createElement("div");
  modalDiv.className = "modal";
  modalDiv.id = "lobbyModal";

      </div>

        <label style="font-size:12px; color:#073b4c;">Tiempo de partida (minutos):</label><br>

window.toggleAdminOptions = function(){
  const email = document.getElementById("emailInput").value.trim().toLowerCase();
  const adminCheck = document.getElementById("adminCheck");

  if(adminCheck.checked){
    if(email !== ADMIN_EMAIL.toLowerCase()){
      swal("Acceso Denegado 🔒", "El correo introducido no tiene permisos de Administrador.", "error");
      adminCheck.checked = false;
      document.getElementById("adminOptions").style.display = "none";
      return;
    }
    document.getElementById("adminOptions").style.display = "block";
  } else {
    document.getElementById("adminOptions").style.display = "none";
  }
}

window.joinGame = async function(){
  const email = document.getElementById("emailInput").value.trim();
  const code = document.getElementById("codeInput").value.trim().toUpperCase();
  const team = document.getElementById("teamSelect").value;
  const isAdminCheck = document.getElementById("adminCheck").checked;

  if(!email || !code){ swal("Error", "Introduce un correo y código válidos", "warning"); return; }

  STATE.user.email = email;
  STATE.roomCode = code;
  STATE.team = team;
  STATE.isAdmin = isAdminCheck && (email.toLowerCase() === ADMIN_EMAIL.toLowerCase());

  let durationMinutes = 60;

  if(STATE.isAdmin){
    durationMinutes = parseInt(document.getElementById("gameDuration").value) || 30;
    const maxCards = parseInt(document.getElementById("maxCards").value) || 10;

    await supabase.from('rooms').upsert({
      code: STATE.roomCode,
      active: true,
      duration: durationMinutes,
      red_score: 0,
      blue_score: 0
    });

    await supabase.from('geocaches').delete().eq('room_code', STATE.roomCode);

    const newGeocaches = [];
    for(let i = 0; i < maxCards; i++){
      const template = CARD_POOL[i % CARD_POOL.length];
      const offsetLat = (Math.random() - 0.5) * 0.015;
      const offsetLng = (Math.random() - 0.5) * 0.015;

      newGeocaches.push({
        room_code: STATE.roomCode,
        lat: STATE.userLat + offsetLat,
        lng: STATE.userLng + offsetLng,
        card_name: template.name,
        card_type: template.type,
        attack: template.attack,
        defense: template.defense,
        claimed: false
      });
    }

    await supabase.from('geocaches').insert(newGeocaches);
  } else {
    const { data: roomData } = await supabase.from('rooms').select('duration').eq('code', STATE.roomCode).single();
    if(roomData && roomData.duration){
      durationMinutes = roomData.duration;
    }
  }

  document.getElementById("lobbyModal").remove();
  document.getElementById("panel").style.display = "block";
  document.getElementById("btnExit").style.display = "inline-block";
  document.getElementById("timerContainer").style.display = "block";

  initMap();
  startGeolocationTracking();
  loadGeocachesFromSupabase();
  listenRoomChanges();
  setupRealtimePresence();
  startTimer(durationMinutes * 60);
};

function initMap(){
  if(STATE.mapInitialized) return;
  STATE.map = L.map('map').setView([STATE.userLat, STATE.userLng], 15);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(STATE.map);
  STATE.mapInitialized = true;
}

function startGeolocationTracking(){
  if ("geolocation" in navigator) {
    STATE.watchPositionId = navigator.geolocation.watchPosition(
      (position) => {
        STATE.userLat = position.coords.latitude;
        STATE.userLng = position.coords.longitude;
        updateUserPositionOnMap();
      },
      (error) => {
        console.warn("GPS no disponible o denegado. Usando ubicación simulada en Deltebre.", error);
        updateUserPositionOnMap();
      },
      { enableHighAccuracy: true, timeout: 10000, maximumAge: 2000 }
    );
  } else {
    updateUserPositionOnMap();
  }
}

function updateUserPositionOnMap(){
  if(!STATE.map) return;

  const color = STATE.team === 'red' ? '#e63946' : '#1d3557';
  const playerIcon = L.divIcon({
    className: "my-position-icon",
    html: `<div style="background:${color}; width:20px; height:20px; border-radius:50%; border:3px solid white; box-shadow:0 0 10px rgba(0,0,0,0.6);"></div>`,
    iconSize: [20, 20],
    iconAnchor: [10, 10]
  });

  if(STATE.userMarker){
    STATE.userMarker.setLatLng([STATE.userLat, STATE.userLng]);
  } else {
    STATE.userMarker = L.marker([STATE.userLat, STATE.userLng], { icon: playerIcon, zIndexOffset: 1000 }).addTo(STATE.map);
    STATE.userMarker.bindPopup("<b>¡Tú estás aquí!</b>");
  }

  if(STATE.rangeCircle){
    STATE.rangeCircle.setLatLng([STATE.userLat, STATE.userLng]);
  } else {
    STATE.rangeCircle = L.circle([STATE.userLat, STATE.userLng], {
      color: color,
      fillColor: color,
      fillOpacity: 0.15,
      radius: 50
    }).addTo(STATE.map);
  }

  if(roomChannel){
    roomChannel.track({
      lat: STATE.userLat,
      lng: STATE.userLng,
      team: STATE.team,
      online_at: new Date().toISOString()
    });
  }
}

async function loadGeocachesFromSupabase(){
  const { data, error } = await supabase
    .from('geocaches')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('claimed', false);

  if(error) { console.error(error); return; }
  if(!data || data.length === 0) return;

  const group = [L.marker([STATE.userLat, STATE.userLng])];

  data.forEach(cache => {
    const cacheIcon = L.divIcon({
      className: "cache-icon",
      html: `<div class="cacheMarker">🎁</div>`,
      iconSize: [30,30],
      iconAnchor: [15,15]
    });

    const marker = L.marker([cache.lat, cache.lng], { icon: cacheIcon }).addTo(STATE.map);
    group.push(marker);

    marker.on("click", async () => {
      const distance = getDistanceInMeters(STATE.userLat, STATE.userLng, cache.lat, cache.lng);
      if(distance > 50){
        swal("Estás muy lejos (" + Math.round(distance) + "m)", "Entra dentro de tu círculo de 50m para reclamar esta carta.", "warning");
        return;
      }

      const { error: updateErr } = await supabase
        .from('geocaches')
        .update({ claimed: true, team: STATE.team })
        .eq('id', cache.id);

      if(updateErr){ swal("Error al reclamar"); return; }

      await supabase.from('player_cards').insert({
        room_code: STATE.roomCode,
        team: STATE.team,
        user_email: STATE.user.email,
        card_name: cache.card_name,
        attack: cache.attack,
        defense: cache.defense,
        image_url: cache.image_url
      });

      swal("¡Carta Conseguida! 🎴", `Has obtenido: ${cache.card_name}`, "success");
      STATE.map.removeLayer(marker);
    });
  });

  if(group.length > 0){
    const featureGroup = L.featureGroup(group);
    STATE.map.fitBounds(featureGroup.getBounds().pad(0.3));
  }
}

function updatePlayerMarkers(presenceState) {
  let totalPlayers = 0;
  const now = Date.now();

  Object.keys(playerMarkers).forEach(email => {
    if (!presenceState[email]) {
      STATE.map.removeLayer(playerMarkers[email]);
      delete playerMarkers[email];
    }
  });

  Object.keys(presenceState).forEach(email => {
    const playerDatas = presenceState[email];
    totalPlayers += playerDatas.length;
    
    playerDatas.forEach(data => {
      if (email === STATE.user.email) return;

      const color = data.team === 'red' ? '#e63946' : '#1d3557';
      const playerIcon = L.divIcon({
        className: "player-icon",
        html: `<div style="background:${color}; width:16px; height:16px; border-radius:50%; border:2px solid white; box-shadow:0 0 6px rgba(0,0,0,0.5);"></div>`,
        iconSize: [16, 16],
        iconAnchor: [8, 8]
      });

      if (playerMarkers[email]) {
        playerMarkers[email].setLatLng([data.lat, data.lng]);
      } else {
        const marker = L.marker([data.lat, data.lng], { icon: playerIcon }).addTo(STATE.map);
        marker.bindPopup(`Jugador (${data.team.toUpperCase()})`);
        playerMarkers[email] = marker;
      }

      if(data.team !== STATE.team) {
        const distanceToEnemy = getDistanceInMeters(STATE.userLat, STATE.userLng, data.lat, data.lng);
        const lastBattle = battleCooldowns[email] || 0;

        if(distanceToEnemy <= 30 && (now - lastBattle > 120000)){
          battleCooldowns[email] = now;
          triggerTacticalPvPBattle(email, data.team);
        }
      }
    });
  });

  const onlineEl = document.getElementById("onlineCount");
  if(onlineEl) onlineEl.innerText = totalPlayers;
}

/* ===================================================
   ⚔️ SISTEMA DE DUELO TÁCTICO POR TURNOS (MEJOR DE 3)
=================================================== */
async function triggerTacticalPvPBattle(enemyEmail, enemyTeam) {
  const { data: myCards } = await supabase
    .from('player_cards')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email);

  let cardOptions = "";
  if(myCards && myCards.length > 0) {
    myCards.forEach((c, index) => {
      cardOptions += `<option value="${index}">${c.card_name} (⚔️Atq: ${c.attack} | 🛡️Def: ${c.defense})</option>`;
    });
  } else {
    cardOptions = `<option value="-1">Carta Básica de Emergencia (⚔️15 | 🛡️15)</option>`;
  }

  const modal = document.createElement("div");
  modal.className = "modal";
  modal.innerHTML = `
    <div>
      <h2>⚔️ ¡DUELO TÁCTICO PVP!</h2>
      <p>Te encuentras con un rival del equipo <b>${enemyTeam.toUpperCase()}</b>.</p>
      <p><b>Combate a 3 Rondas:</b> Selecciona tu carta para la <b>Ronda 1</b>:</p>
      <select id="roundCardSelect">${cardOptions}</select><br><br>
      <button onclick="window.startRound1('${enemyEmail}', '${enemyTeam}')">Confirmar Ronda 1 🚀</button>
    </div>
  `;
  document.body.appendChild(modal);

  // Variables locales del duelo actual
  window.myWins = 0;
  window.enemyWins = 0;
  window.currentRound = 1;
  window.storedCards = myCards || [];

  window.startRound1 = function(eEmail, eTeam) {
    const sel = parseInt(document.getElementById("roundCardSelect").value);
    let myScore = 30;
    if(sel >= 0 && window.storedCards[sel]) {
      myScore = window.storedCards[sel].attack + window.storedCards[sel].defense;
    }
    const enemyScore = Math.floor(Math.random() * 120) + 20;

    if(myScore >= enemyScore) window.myWins++;
    else window.enemyWins++;

    // Pasar a Ronda 2
    document.querySelector(".modal > div").innerHTML = `
      <h2>⚔️ DUELO TÁCTICO - Ronda 2</h2>
      <p>Resultados parciales: Tú (${window.myWins}) - Rival (${window.enemyWins})</p>
      <p>Selecciona tu carta para la <b>Ronda 2</b>:</p>
      <select id="roundCardSelect">${cardOptions}</select><br><br>
      <button onclick="window.startRound2('${eEmail}', '${eTeam}')">Confirmar Ronda 2 🚀</button>
    `;
  };

  window.startRound2 = function(eEmail, eTeam) {
    const sel = parseInt(document.getElementById("roundCardSelect").value);
    let myScore = 30;
    if(sel >= 0 && window.storedCards[sel]) {
      myScore = window.storedCards[sel].attack + window.storedCards[sel].defense;
    }
    const enemyScore = Math.floor(Math.random() * 120) + 20;

    if(myScore >= enemyScore) window.myWins++;
    else window.enemyWins++;

    // Pasar a Ronda 3 (Definitiva)
    document.querySelector(".modal > div").innerHTML = `
      <h2>⚔️ DUELO TÁCTICO - Ronda 3 (Final)</h2>
      <p>Resultados parciales: Tú (${window.myWins}) - Rival (${window.enemyWins})</p>
      <p>Selecciona tu carta para la <b>Ronda Definitiva</b>:</p>
      <select id="roundCardSelect">${cardOptions}</select><br><br>
      <button onclick="window.finalizeBattle('${eEmail}', '${eTeam}')">¡Ver Resultado Final! 🏆</button>
    `;
  };

  window.finalizeBattle = async function(eEmail, eTeam) {
    const sel = parseInt(document.getElementById("roundCardSelect").value);
    let myScore = 30;
    if(sel >= 0 && window.storedCards[sel]) {
      myScore = window.storedCards[sel].attack + window.storedCards[sel].defense;
    }
    const enemyScore = Math.floor(Math.random() * 120) + 20;

    if(myScore >= enemyScore) window.myWins++;
    else window.enemyWins++;

    modal.remove();

    if(window.myWins > window.enemyWins) {
      swal("¡VICTORIA TOTAL EN DUELO! 🏆", `Has ganado ${window.myWins} de 3 rondas contra el equipo ${eTeam.toUpperCase()}. ¡Has sumado +150 puntos para tu equipo!`, "success");
      
      const scoreKey = STATE.team === 'red' ? 'red_score' : 'blue_score';
      const { data: currentRoom } = await supabase.from('rooms').select(scoreKey).eq('code', STATE.roomCode).single();
      if(currentRoom) {
        const newScore = (currentRoom[scoreKey] || 0) + 150;
        await supabase.from('rooms').update({ [scoreKey]: newScore }).eq('code', STATE.roomCode);
      }
    } else {
      swal("DERROTA EN EL DUELO TÁCTICO 💔", `El rival ganó ${window.enemyWins} de 3 rondas. ¡Mejora tus cartas explorando más el mapa!`, "error");
    }
  };
}

function startTimer(durationSeconds){
  if(timerInterval) clearInterval(timerInterval);
  let timer = durationSeconds;
  const display = document.getElementById("timer");
  
  timerInterval = setInterval(async () => {
    let minutes = parseInt(timer / 60, 10);
    let seconds = parseInt(timer % 60, 10);

    minutes = minutes < 10 ? "0" + minutes : minutes;
    seconds = seconds < 10 ? "0" + seconds : seconds;

    display.textContent = minutes + ":" + seconds;

    if (--timer < 0) {
      clearInterval(timerInterval);
      
      const { data: roomData } = await supabase
        .from('rooms')
        .select('red_score, blue_score')
        .eq('code', STATE.roomCode)
        .single();

      const red = roomData ? (roomData.red_score || 0) : 0;
      const blue = roomData ? (roomData.blue_score || 0) : 0;

      let winnerMsg = "¡HAY UN EMPATE! 🤝";
      if(red > blue) winnerMsg = "🏆 ¡EL EQUIPO ROJO 🔴 HA GANADO LA PARTIDA!";
      else if(blue > red) winnerMsg = "🏆 ¡EL EQUIPO AZUL 🔵 HA GANADO LA PARTIDA!";

      swal({
        title: "¡Partida Finalizada! ⏳",
        text: `${winnerMsg}\n\nPuntuación Final:\n🔴 Equipo Rojo: ${red} pts\n🔵 Equipo Azul: ${blue} pts`,
        icon: "info",
        button: "Volver al Lobby 🚀"
      }).then(() => {
        window.location.reload();
      });
    }
  }, 1000);
}

function listenRoomChanges(){
  supabase
    .channel('room-channel')
    .on('postgres_changes', { event: 'UPDATE', schema: 'public', table: 'rooms', filter: `code=eq.${STATE.roomCode}` }, payload => {
      if(payload.new.red_score !== undefined) document.getElementById("redScore").innerText = payload.new.red_score;
      if(payload.new.blue_score !== undefined) document.getElementById("blueScore").innerText = payload.new.blue_score;
    })
    .subscribe();
}

function setupRealtimePresence() {
  roomChannel = supabase.channel(`room-presence-${STATE.roomCode}`, {
    config: { presence: { key: STATE.user.email } }
  });

  roomChannel
    .on('presence', { event: 'sync' }, () => {
      const state = roomChannel.presenceState();
      updatePlayerMarkers(state);
    })
    .subscribe(async (status) => {
      if (status === 'SUBSCRIBED') {
        await roomChannel.track({
          lat: STATE.userLat,
          lng: STATE.userLng,
          team: STATE.team,
          online_at: new Date().toISOString()
        });
      }
    });
}

document.getElementById("btnInventory").addEventListener("click", async () => {
  const { data, error } = await supabase
    .from('player_cards')
    .select('*')
    .eq('room_code', STATE.roomCode)
    .eq('user_email', STATE.user.email);

  if(error || !data || !data.length){ 
    swal("Inventario vacío", "Aún no has capturado ninguna carta en el mapa.", "info"); 
    return; 
  }

  let html = `<h3>Tus Cartas Coleccionadas</h3><div style="max-height:250px; overflow-y:auto; text-align:left;">`;
  data.forEach(card => {
    html += `<div style="border:1px solid #ccc; padding:8px; margin:5px; border-radius:8px;">
      <b>${card.card_name}</b><br>⚔️ Ataque: ${card.attack} | 🛡️ Defensa: ${card.defense}
    </div>`;
  });
  html += `</div>`;
  
  const div = document.createElement("div");
  div.className = "modal";
  div.innerHTML = `<div>${html}<br><button onclick="this.closest('.modal').remove()">Cerrar</button></div>`;
  document.body.appendChild(div);
});

document.getElementById("btnExit").addEventListener("click", () => {
  if (STATE.watchPositionId) navigator.geolocation.clearWatch(STATE.watchPositionId);
  if (roomChannel) supabase.removeChannel(roomChannel);
  if (timerInterval) clearInterval(timerInterval);
  window.location.reload();
});

// Arrancar el Lobby
showLobby();
</script>
